<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ slide.title }}</title>
    <style>
        /* Full-bleed photograph with a caption and a photographer credit.
           Deliberately standalone (no base), for the same reason image.html is:
           there is no footer or sidebar chrome to inherit — the photograph *is*
           the slide. The token block below therefore mirrors _base.html and must
           be kept in step with it when tokens change.

           Why this exists rather than an `image` slide with extra fields: an
           image slide is a picture and nothing else, and gains no caption, no
           credit and no scrim. A photo set that carries an attribution is a
           different thing, and the credit is not optional decoration — it is
           what the photographer is paid in. */
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
        :root {
            --navy-1: #0f2346;
            --navy-2: #0a1c3a;
            --gold:   #d4af37;
            --bg:     linear-gradient(165deg, var(--navy-1) 0%, var(--navy-2) 100%);
            --text:   #ffffff;
            --accent: var(--gold);
            --safe-x: 5vw;
            --safe-y: 5vh;
            --t-lg:   2.8vw;
            --t-md:   2vw;
            --t-sm:   1.2vw;
            --t-xs:   0.9vw;
            --title-shadow: 0 0.28vh 0.55vh rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: 'Lato', -apple-system, Arial, sans-serif;
            color: var(--text);
        }
        .photo {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        /* The source photographs are natively 16:9, so `cover` crops nothing on a
           16:9 panel — it is here to guarantee full bleed on a panel that isn't,
           rather than to reframe the shot. */

        /* Scrim: the caption sits over photographs whose bottom edge ranges from
           dark carpet to a lit sunset, so legibility can't be left to the image.
           A gradient rather than a bar keeps the photograph uninterrupted — the
           picture is the point, the words are a label on it. */
        .scrim {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 38%;
            background: linear-gradient(to top,
                        rgba(0,0,0,0.72) 0%,
                        rgba(0,0,0,0.45) 38%,
                        rgba(0,0,0,0) 100%);
            pointer-events: none;
        }
        .caption-bar {
            position: absolute;
            left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-y);
            display: flex;
            align-items: flex-end;
            gap: 2vw;
        }
        .caption {
            flex: 1;
            min-width: 0;
            font-size: var(--t-md);
            font-weight: 700;
            line-height: 1.25;
            text-shadow: var(--title-shadow);
        }
        /* The credit rides on every photograph, not just the deck's bookends.
           Dim enough to stay out of the picture, present enough to be a credit. */
        .credit {
            flex-shrink: 0;
            font-size: var(--t-sm);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.72);
            text-align: right;
            line-height: 1.3;
            padding-bottom: 0.4vh;
        }
        .placeholder {
            position: absolute; inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--t-lg);
            color: rgba(255,255,255,0.5);
        }
    </style>
    <script src="/assets/js/slide-bridge.js?v={{ asset_version }}"></script>
</head>
<body>
    {% if slide.image is defined %}
    <img class="photo" src="/{{ slide.image }}" alt="{{ slide.alt | default(slide.caption | default(slide.title)) }}">
    {% else %}
    <div class="placeholder">{{ slide.title }}</div>
    {% endif %}
    {% if slide.caption is defined or slide.credit is defined %}
    <div class="scrim"></div>
    <div class="caption-bar">
        <div class="caption">{{ slide.caption | default('') }}</div>
        {% if slide.credit is defined %}
        <div class="credit">{{ slide.credit }}</div>
        {% endif %}
    </div>
    {% endif %}
</body>
</html>
