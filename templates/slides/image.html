<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ slide.title }}</title>
    <style>
        /* Fullbleed image slide — deliberately standalone (no base): it has no
           footer or sidebar chrome. The tokens below mirror _base.html so the
           placeholder state stays on-brand and zoom-invariant. */
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        :root {
            --navy-1: #0f2346;
            --navy-2: #0a1c3a;
            --bg:     linear-gradient(165deg, var(--navy-1) 0%, var(--navy-2) 100%);
            --t-lg:   2.8vw;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .placeholder {
            width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', -apple-system, Arial, sans-serif;
            font-size: var(--t-lg);
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    {% if slide.image is defined %}
    <img src="/{{ slide.image }}" alt="{{ slide.title }}">
    {% else %}
    <div class="placeholder">{{ slide.title }}</div>
    {% endif %}
</body>
</html>
