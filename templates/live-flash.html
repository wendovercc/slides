<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Live highlight</title>
    <style>
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
        :root {
            --navy-1: #0f2346; --navy-2: #0a1c3a; --gold: #d4af37;
            --light-blue: #b4c8e4; --bg: linear-gradient(165deg, var(--navy-1), var(--navy-2));
            --text: #fff; --muted: var(--light-blue); --accent: var(--gold);
            --safe-x: 5vw; --safe-y: 5vh;
            --t-lg: 2.8vw; --t-md: 2vw; --t-sm: 1.2vw; --t-xs: 0.9vw; --t-xxs: 0.7vw;
            /* Same tag geometry as the curated reel so the QR-bug cover lines up. */
            --reel-tag-size: 11vw; --reel-tag-top: 0px; --reel-tag-left: 0px;
            --reel-narr-bottom: 9.83%; --reel-narr-minw: 32.6vw;
            --reel-narr-h: 5vh; --reel-narr-slope: 0.56;
            --reel-narr-bg: #61b5f2; --reel-narr-end-bg: #0e3c62;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden; background: var(--bg);
            font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--text);
            display: flex; align-items: flex-start;
        }
        /* Full-bleed clip, top-docked so it shares an origin with the top-left tag
           (matches the curated reel's fullbleed handling). */
        #flash-video { position: absolute; top: 0; left: 0; width: 100%; height: auto; display: block; z-index: 0; }

        /* Shared reel-tag look (top-left crest/innings/caption + outcome badge). */
{% include 'slides/_reel_tag_styles.html' %}

        .flash-fallback {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: var(--t-lg); font-weight: 700; color: var(--muted); z-index: 1;
        }
        .flash-fallback[hidden] { display: none; }
    </style>
    <script src="/assets/js/hls.min.js?v={{ asset_version }}"></script>
    <script src="/assets/js/hls-cache.js?v={{ asset_version }}"></script>
</head>
<body>
    <video id="flash-video" muted playsinline preload="none"></video>

    <div class="reel-tag">
        <div id="reel-caption" class="reel-tag-caption" style="display:none"></div>
        <div id="reel-panel" class="reel-panel">
            <div class="reel-tag-square">
                <div class="reel-tag-kicker">Live Highlight</div>
                <div id="reel-fixture" class="reel-tag-fixture" style="display:none">
                    <span id="reel-team" class="rt-team"></span>
                    <span id="reel-vs" class="rt-vs">vs</span>
                    <span id="reel-opp" class="rt-opp"></span>
                </div>
                <div id="reel-label" class="reel-tag-label" style="display:none"></div>
            </div>
        </div>
    </div>

    <div id="flash-fallback" class="flash-fallback" hidden>Loading highlight…</div>

<script>
(function () {
    var video = document.getElementById('flash-video');
    var captionEl = document.getElementById('reel-caption');
    var fixtureEl = document.getElementById('reel-fixture');
    var teamEl = document.getElementById('reel-team');
    var vsEl = document.getElementById('reel-vs');
    var oppEl = document.getElementById('reel-opp');
    var labelEl = document.getElementById('reel-label');
    var fallbackEl = document.getElementById('flash-fallback');

    var hls = null;
    var doneToken = 0;      // guards against a late 'ended'/timeout from a prior clip
    var backstop = null;
    var MAX_MS = 60000;     // hard backstop: never wedge the deck if 'ended' never fires

    function esc(s) { return String(s == null ? '' : s); }
    function show(el, on) { el.style.display = on ? '' : 'none'; }

    function clearTimers() {
        if (backstop) { clearTimeout(backstop); backstop = null; }
    }
    function teardown() {
        clearTimers();
        try { video.pause(); } catch (e) {}
        if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    }
    function done(reason) {
        var tok = doneToken;
        teardown();
        // Only report if still the active playthrough (a superseding flash bumps the token).
        if (tok !== doneToken) return;
        try { parent.postMessage({ type: 'wcc-flash-done', reason: reason || 'ended' }, '*'); } catch (e) {}
    }

    function attach(url) {
        // Safari can play HLS natively; Chromium (the Pi wall) needs hls.js.
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(function () {});
            return;
        }
        if (window.Hls && Hls.isSupported()) {
            // Play from the prefetched cache (the player downloads the clip before it
            // ever fires this flash), so this opens on local bytes, not a stream.
            var opts = { enableWorker: true, lowLatencyMode: false };
            var cacheLoader = window.WccHlsCache && WccHlsCache.loader();
            if (cacheLoader) opts.loader = cacheLoader;
            hls = new Hls(opts);
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });
            hls.on(Hls.Events.ERROR, function (e, data) { if (data && data.fatal) done('hls-error'); });
            return;
        }
        done('no-hls');
    }

    function renderTag(clip) {
        // Caption = the frogbox narrative; the square carries the match context —
        // our team (gold) vs the opposition (white) + the innings — so it reads
        // exactly like the last-match / today's-match reels.
        captionEl.textContent = esc(clip.title);
        show(captionEl, !!clip.title);
        teamEl.textContent = esc(clip.team);
        oppEl.textContent = esc(clip.opp);
        show(vsEl, !!clip.opp);
        show(fixtureEl, !!(clip.team || clip.opp));
        labelEl.textContent = esc(clip.innings_label);
        show(labelEl, !!clip.innings_label);
    }

    function playClip(clip) {
        doneToken++;
        teardown();
        if (!clip || !clip.url) { done('no-url'); return; }
        renderTag(clip);
        show(fallbackEl, false); fallbackEl.hidden = true;
        video.currentTime = 0;
        attach(clip.url);
        backstop = setTimeout(function () { done('timeout'); }, MAX_MS);
    }

    video.addEventListener('ended', function () { done('ended'); });
    video.addEventListener('error', function () { done('video-error'); });

    // Player drives this overlay directly (it's not a slide in the rotation):
    //   { type:'wcc-flash', url, event, title, over, ball, crest, innings_label,
    //     team, opp, batter, bowler, dismissed }
    //   team/opp = our side vs the opposition (the square's fixture line);
    //   innings_label = "1st Innings" / "2nd Innings" (the docked bottom tab).
    window.addEventListener('message', function (e) {
        var d = e.data; if (!d) return;
        if (d.type === 'wcc-flash') playClip(d);
        else if (d.type === 'wcc-flash-stop') done('stopped');
    });
})();
</script>
</body>
</html>
