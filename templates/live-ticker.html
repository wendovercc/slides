<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Live ticker</title>
    <style>
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
        :root {
            --navy-1: #0f2346; --navy-2: #0a1c3a; --gold: #d4af37;
            --light-blue: #b4c8e4; --text: #fff; --muted: var(--light-blue); --accent: var(--gold);
            --t-md: 2vw; --t-sm: 1.2vw; --t-xs: 0.9vw;
            /* Match the player's chrome matte (sidebar darker navy) so the footer bar
               and the left strip read as one continuous recessed band. */
            --matte: #08152c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        /* The player sizes this iframe to the bottom footer band (below the retracted
           slide layer) and reveals it there; the bar simply fills it. Transparent
           elsewhere so the stage matte shows through while the bar is hidden. */
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent;
            font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--text); }

        .ticker-bar {
            position: absolute; inset: 0; display: flex; align-items: stretch;
            background: var(--matte); border-top: 0.15vw solid var(--accent);
            opacity: 0; transition: opacity 0.4s ease;
        }
        .ticker-bar.show { opacity: 1; }

        /* The gold tile, bottom-left: THE EVENT TYPE. Its width is pinned to the live
           band (the strip's width: this iframe spans the stage, so `--live-band` vw
           lands exactly under the strip), so the strip's gold spine runs down into
           this tile's right edge and the ticker's gold top border runs off its left —
           one continuous L. Keep --live-band in step with the players'.

           IT USED TO NAME THE MATCH — the featured XI over its division — and stood in
           as the header for the whole chrome, the strip above it having none of its
           own. That was the wrong occupant for the slot twice over. The content did not
           fit: `is-long` exists only because "U11 Incredibles" over "TVCL Div 6C" has to
           shrink to survive 8vw, so the brightest block on the screen was shrinking its
           type to say the least urgent of the three things. And it answered the wrong
           question: at ten feet the gold is read first, so it should say WHAT JUST
           HAPPENED, not whose. The type is also a short closed vocabulary — TOSS,
           WICKET, SIX, RESULT, RAIN — which fits on one line at full size.

           It makes the corner the hinge of both readings of the L: along the bottom,
           WICKET → the description; up the side, WICKET → what it did to the match. And
           with v1's nine-second cycle gone, the tile flipping is the cheapest signal
           that the screen CHANGED rather than drifted.

           Whose match it is moves to the strip's own bottom band, directly above this
           tile — see live-strip.html. Bottom rather than top so that the attribution
           lands on both paths out of the corner instead of stranded 90vh away at the
           far end of one. */
        .tick-live {
            --live-band: 8vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.15vw; flex-shrink: 0; width: var(--live-band); padding: 0 0.4vw;
            background: var(--accent); color: var(--navy-1);
            font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.05;
            /* Backstop: nothing may spill out of the band and over the gold rule,
               whatever the label turns out to be. */
            overflow: hidden;
        }
        /* The type label, with the live dot riding INLINE at the head of the text —
           not as a flex sibling — so a two-word type ("MATCH" / "FINISHED") keeps the
           dot on its first line instead of leaving it stranded beside a block.
           Clamped to two lines. */
        .tick-live-label { font-size: var(--t-sm); letter-spacing: 0.1em;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; }
        /* Long labels — "MATCH FINISHED", "FIVE WICKETS" — step down a size and shed
           most of the tracking. The binding constraint is the longest WORD, which
           can't be broken: at this size an 11-character one still fits the band's
           ~7.2vw of content width. Applied by isLongLabel() below, on the label's
           actual shape rather than a fixed list. The type vocabulary is short enough
           that this should now be rare, but "Match finished" still trips it. */
        .tick-live.is-long .tick-live-label { font-size: 0.85vw; letter-spacing: 0.03em; }
        .tick-live i { display: inline-block; vertical-align: 0.04em;
            width: 0.8vw; height: 0.8vw; margin-right: 0.4vw;
            border-radius: 50%; background: #b3261e; }
        .tick-live.is-live i { background: #b3261e; animation: tick-pulse 1.8s infinite; }
        @keyframes tick-pulse {
            0% { box-shadow: 0 0 0 0 rgba(179,38,30,0.6); }
            70% { box-shadow: 0 0 0 0.7vw rgba(179,38,30,0); }
            100% { box-shadow: 0 0 0 0 rgba(179,38,30,0); }
        }

        /* Cycling detail area. Segments fade in place. */
        .tick-body { position: relative; flex: 1; min-width: 0; overflow: hidden; }
        .tick-seg {
            position: absolute; inset: 0; display: flex; align-items: center; gap: 0.8vw;
            padding: 0 1.4vw; font-size: var(--t-md); line-height: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            opacity: 0; transition: opacity 0.35s ease;
        }
        .tick-seg.on { opacity: 1; }
        /* THE SCORELINE, IN THE MATCH-DAY BOARD'S GRAMMAR. A score on the band and a
           score on the tile a few centimetres above it are the same fact, so they
           are typed the same way: the club in white, the figure in gold because gold
           is the scoreline everywhere on this wall, the overs a rung smaller and blue
           because they qualify the score rather than being part of it. See `.sq-runs`
           and `.sq-ov` in templates/slides/match-day.html, which these mirror.
           (They replace a v1 pairing that read both sides in white — that was a
           scoreline naming two teams at once, which this is not.) */
        .tick-seg .team { font-weight: 900; color: var(--text); }
        .tick-seg .score { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
        .tick-seg .ov { font-weight: 400; font-size: var(--t-sm); color: var(--light-blue); }
        /* The parts above sit inside ONE span rather than being flex children of the
           segment, so they are separated by an ordinary word space instead of the
           segment's 0.8vw gap — "9/0 (1 ov)" is a phrase, not three columns. */
        .tick-seg .line { font-weight: 400; color: var(--text); }
        /* WHICH PHRASE GIVES WAY WHEN THE LINE IS TOO LONG, and it must not be the
           ends. The scoreline is what the glance is for and the third phrase is the
           club that would otherwise go unnamed all afternoon; the middle clause —
           a dismissal's particulars, a burst of boundaries — is the expendable one,
           so it is the only shrinkable item and it ellipsises inside itself.
           Without this the segment simply clipped its own right-hand end, which is
           exactly where the newest information sits. */
        .tick-seg > .line, .tick-seg > .tail, .tick-seg > .sep { flex: 0 0 auto; }
        .tick-seg > .det { flex: 0 1 auto; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tick-seg .bat { font-weight: 700; color: var(--text); }
        /* Shared by at-crease batters and the last-wicket line so player names read
           the same everywhere; the trailing figures/dismissal stay muted. */
        .tick-seg .num { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
        .tick-seg .star { color: var(--accent); }
        .tick-seg .lbl { color: var(--muted); font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.06em; }
        /* Provisional-result note — muted, not uppercase. */
        .tick-seg .prov { color: var(--muted); font-weight: 400; }
        /* The event's supporting clause — the scoreline a wicket left behind, the
           match a result belongs to. Quieter than the headline, because the headline
           is the news and this only qualifies it.
           DIMMED WHITE, NOT `--muted`: on this bar `--muted` IS `--light-blue`, and
           since the overs took that blue as a scoreline part it had started reading
           as a colour with a meaning. The supporting clause is plain prose and should
           recede by weight alone, so it steps down in brightness and keeps the hue of
           the text it follows. */
        .tick-seg .det { color: rgba(255, 255, 255, 0.72); font-weight: 400; }
        /* A whole-segment sentence rather than a row of data parts. On the wall it
           behaves like any other segment (one clipped line); in portrait it wraps
           and the band grows to it. */
        .tick-seg .prose { font-weight: 400; color: var(--text); }
        .tick-seg .sep { color: var(--muted); opacity: 0.5; margin: 0 0.3vw; }

        /* ---- PORTRAIT (?portrait) — the phone's docked row -------------------
           Everything above is sized in `vw`, which assumes the wide viewport of a
           wall: in a ~390px-wide dock `2vw` resolves to under 8px. So portrait
           re-tokenises off `vh` instead — this iframe is a single-line bar whose
           HEIGHT is the constraint and whose width is whatever the phone is, which
           is exactly the axis the type should track.

           The flag also stops being a fixed 8vw band. That width was pinned to the
           strip standing above it so the two read as one L; there is no strip here
           (docs/portrait-decks.md, "Live on the phone"), so the flag is free to be
           an auto-width tag, one line, no division subtitle. */
        /* THE PHONE'S OWN SCALE, borrowed wholesale from the portrait fragments
           (`.pfrag` in assets/css/portrait.css) so the ticker reads as part of the
           same surface rather than as a shrunken wall. `--t-md` here IS `.pf-body`
           — the body copy of a portrait showcase card — and the segment takes it at
           body weight.

           It replaces a `vh` scale that was wrong for a reason worth recording: in
           an IFRAME, `vh` is the iframe's own height, and this one is about 64px
           tall. `3vh` of left padding came out at under 2px, which is why the text
           sat flush against the edge. The wall's `vw` tokens have the mirror problem
           in the other direction. `--u` is floored in px and so is immune to both. */
        html.portrait {
            --u: clamp(3.4px, 1vw, 6px);
            --t-md: calc(4.4 * var(--u));
            --t-sm: calc(3.4 * var(--u));
            --t-xs: calc(2.9 * var(--u));
            --pad-x: calc(3.2 * var(--u));
        }
        /* STACKED, NOT SIDE BY SIDE. On the wall the flag is a full-height tile
           because there is width to spare and a strip standing on top of it; on a
           phone that tile ate most of the line the ticker had to say anything in.
           So the flag becomes a small badge on the first row and the segment gets
           the whole width of the second.
           The matte and the gold rule are the DOCK's out here (see #live-dock in
           player.html) — a border drawn in this document stops where the iframe
           stops, which is short of the screen edge by the chevron's width. */
        html.portrait .ticker-bar {
            flex-direction: column; align-items: stretch; justify-content: center;
            gap: calc(0.5 * var(--u)); padding: 0;
            background: transparent; border-top: none; }
        /* An auto-width square badge on its own row, not a full-height column, and
           DOCKED TO THE EDGE: the gutter belongs to the running text, not to a block
           of colour. A gold tile inset from the screen edge reads as a floating chip;
           run into the corner it reads as a tab on the band, which is what it is. */
        html.portrait .tick-live {
            flex-direction: row; align-items: center; align-self: flex-start;
            width: auto; padding: 0.4em 0.75em; gap: 0.6em; border-radius: 0; }
        /* THE BADGE IS THE AFFORDANCE. It was a separate chevron out in the player's
           document, beside the frame; here it rides inside the gold tile, which
           makes the tile itself read as the thing you press. Deliberately the same
           arrow the portrait fragments use for a link (`.pf-link::after` in
           assets/css/portrait.css): gold ground, navy text, an arrow at 400 and 0.85
           — so a link on the phone looks like a link wherever it turns up. The badge
           already had that ground and that colour; it only needed the arrow. */
        html.portrait .tick-live::after {
            content: '\2192'; font-size: var(--t-xs); font-weight: 400; opacity: 0.85; }
        html.portrait .tick-live-label,
        html.portrait .tick-live.is-long .tick-live-label {
            -webkit-line-clamp: 1; white-space: nowrap; letter-spacing: 0.08em;
            font-size: var(--t-xs); }
        html.portrait .tick-live i {
            width: 0.62em; height: 0.62em; margin-right: 0.55em; }
        /* GROWS TO ITS CONTENTS. On the wall the ticker is one line in a fixed band
           and anything longer is clipped; on a phone the band is the only live
           surface there is, so the text sets the height and the dock follows it
           (reportHeight below → #live-dock in player.html). Nothing else in the
           chain can do this: an iframe never sizes to its own content, so the height
           has to be measured in here and sent out.
           The ACTIVE segment is in flow and drives the height; the outgoing one goes
           absolute underneath it so the two still crossfade in place. */
        html.portrait, html.portrait body { height: auto; overflow: visible; }
        html.portrait .ticker-bar { position: relative; inset: auto; }
        html.portrait .tick-body { flex: 1 1 auto; min-height: 0; overflow: visible; }
        html.portrait .tick-seg {
            position: relative; inset: auto;
            flex-wrap: wrap; align-items: baseline;
            white-space: normal; overflow: visible; text-overflow: clip; }
        html.portrait .tick-seg:not(.on) { position: absolute; inset: 0; }
        /* Wrap BETWEEN the parts, never inside one — but the parts, not everything.
           A score, an overs figure or a batter's "68 (93)*" is a single token to a
           reader even when it contains spaces, so those are named and pinned. PROSE
           is the opposite case and gets its own class: a paragraph of match
           narrative has to break wherever it likes, and a blanket `> span` rule made
           the whole paragraph one unbreakable token — which is exactly the shape
           these segments are expected to take as they stop being scorelines. */
        html.portrait .tick-seg > span { white-space: normal; }
        html.portrait .tick-seg .team,
        html.portrait .tick-seg .score,
        html.portrait .tick-seg .ov,
        html.portrait .tick-seg .bat,
        html.portrait .tick-seg .num,
        html.portrait .tick-seg .lbl { white-space: nowrap; }
        html.portrait .tick-seg .prose,
        html.portrait .tick-seg .det { white-space: normal; }
        /* Body copy, not display type: same family, weight and size as `.pf-body`.
           The wall's emphasis spans (team/score at 900, batter at 700) come back to
           400 with it, so the line reads as one sentence rather than a scoreboard. */
        html.portrait .tick-seg {
            font-size: var(--t-md); font-weight: 400; line-height: 1.65;
            gap: 0.5em; padding: 0 var(--pad-x); }
        html.portrait .tick-seg .team,
        html.portrait .tick-seg .score,
        html.portrait .tick-seg .bat { font-weight: 400; }
        html.portrait .tick-seg .sep { margin: 0 0.15em; }
        @keyframes tick-pulse-p {
            0% { box-shadow: 0 0 0 0 rgba(179,38,30,0.6); }
            70% { box-shadow: 0 0 0 0.5em rgba(179,38,30,0); }
            100% { box-shadow: 0 0 0 0 rgba(179,38,30,0); }
        }
        html.portrait .tick-live.is-live i { animation: tick-pulse-p 1.8s infinite; }
        /* TIME HELD (the match-day simulator only — see live-clock.js). The bar's
           segment cycle is stopped in script; this stops the things CSS is animating
           on its own, the pulsing live dot above all. A screen described as held has
           to actually be still, or the word means nothing. */
        html.clock-held *, html.clock-held *::before, html.clock-held *::after {
            animation-play-state: paused !important;
            transition: none !important;
        }
    </style>
</head>
<body>
    <div id="ticker" class="ticker-bar">
        <div id="tick-live" class="tick-live is-live">
            <span class="tick-live-label"><i></i><span id="tick-live-text">Live</span></span>
        </div>
        <div class="tick-body">
            <div id="seg-a" class="tick-seg on"></div>
            <div id="seg-b" class="tick-seg"></div>
        </div>
    </div>

<script>
/* THE BAR RENDERS ONE EVENT — the scheduler's current pick — and nothing else.
 *
 * v1 cycled segments built from the latest poll: a scoreline, a last wicket, a break
 * word, every one of them nine seconds whether it was "Wendover 4/0" or a hat-trick.
 * That is the wrong unit for a glance across a room. Under v2 the engine
 * differentiates the feed into events, ranks them and answers one question — what
 * should be on screen — and this bar draws that answer for exactly as long as the
 * event's own dwell says. No cycle, no timer of its own, and "nothing" is a real
 * answer: below the floor the pick is null and the bar goes away rather than looping
 * stale scorelines at an empty afternoon.
 *
 * The split across the L (docs/live-events.md) gives this surface the TEXT and the
 * TYPE and nothing else:
 *     gold tile  the event type          TOSS
 *     bar        the event description   Chalfont St Peter elected to bat
 *     strip      the match it happened in, and whose it is
 *
 * So the bar no longer says which match it is and no longer loads live-config.json to
 * find out — `showing.match` carries the team and division already, and the strip is
 * the surface that shows them.
 */
(function () {
    var bar = document.getElementById('ticker');
    var liveEl = document.getElementById('tick-live');
    var liveLabel = document.getElementById('tick-live-text');
    var segs = [document.getElementById('seg-a'), document.getElementById('seg-b')];
    /* The phone's docked row. The difference from the wall is a type scale that
       tracks the bar's height rather than a wall's width (see the stylesheet).
       docs/portrait-decks.md's other portrait rule — EVENT-FIRST segment order — is
       now moot and got its wish: there is only ever the event. */
    var PORTRAIT = /(^|[?&])portrait($|[=&])/.test(location.search);
    if (PORTRAIT) document.documentElement.classList.add('portrait');
    /* `?tickerdemo` — a long prose segment appended to the cycle, for looking at how
       the band behaves when the text outgrows one line. Passed through from the
       page's own URL by ensurePortraitDock, so it is reachable on any deck without
       editing anything. Deliberately prose rather than a scoreline: the segments are
       expected to become paragraphs of match narrative, and this is what that will
       look like. Never on without the flag, so prod is untouched. */
    var DEMO = /(^|[?&])tickerdemo($|[=&])/.test(location.search);
    var DEMO_TEXT = 'Wendover need 47 from the last eight overs with six wickets ' +
        'standing, after Harrington and Jackson put on 82 for the fourth wicket to ' +
        'drag the chase back from 61 for 3.';

    var face = 0;         // which of the two layers is currently 'on'
    var lastKey = '';     // what's drawn, so an unchanged pick doesn't re-crossfade

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    /* Tell the player how tall we came out. An iframe does not size to its content,
       so the dock's height is OUR measurement, sent out — see #live-dock. Sent after
       a frame so the browser has laid the new segment out, and only when the number
       actually changes: the dock re-places the control bar and re-measures the
       column on every one of these. */
    var lastH = 0;
    function reportHeight() {
        if (!PORTRAIT) return;
        requestAnimationFrame(function () {
            var h = Math.ceil(bar.getBoundingClientRect().height);
            if (!h || h === lastH) return;
            lastH = h;
            try { window.parent.postMessage({ type: 'wcc-ticker-height', height: h }, '*'); } catch (e) {}
        });
    }
    window.addEventListener('resize', function () { lastH = 0; reportHeight(); });

    // Does this label need the smaller tile type? Two ways to be too big for the
    // band: too many characters overall, or a single word too long to break.
    // Deliberately a shape test, not a length-only one. The type vocabulary is much
    // kinder to the band than the team names it replaced — "Match finished" is the
    // only one that still trips it.
    function isLongLabel(label) {
        var words = String(label || '').split(/\s+/);
        var longest = 0;
        words.forEach(function (w) { if (w.length > longest) longest = w.length; });
        return String(label || '').length > 9 || longest > 6;
    }

    /* THE HEADLINE, MARKED UP — when the payload says how.
       Most events hand the band a sentence, which is one span of prose and needs no
       more. A SCORELINE is not a sentence: "High Wycombe 9/0 (1 ov)" is a club, a
       figure and the overs that qualify it, and those three are typed differently
       here exactly as they are on the match-day board. So a payload may carry
       `parts` — [{ cls, text }] — and this turns them into spans; `headline` stays
       on the payload as the flat form every other surface (the flash, the inspector)
       reads, and as the fallback here.

       The class is WHITELISTED rather than written through. The payload is built
       from feed data, and a stylesheet class is the one place a renderer can be
       talked into something by a string it did not write. */
    var PART_CLS = { team: 1, score: 1, ov: 1, det: 1, num: 1, star: 1, lbl: 1, prov: 1 };
    function partsHtml(parts, fallback, cls) {
        if (!parts || !parts.length) return '<span class="prose">' + esc(fallback) + '</span>';
        return '<span class="' + (cls || 'line') + '">' + parts.map(function (p) {
            var cls = PART_CLS[p && p.cls] ? p.cls : '';
            return '<span class="' + cls + '">' + esc(p && p.text) + '</span>';
        }).join(' ') + '</span>';
    }

    /* THE SCHEDULER'S PICK, DRAWN. `showing` is the whole event record — see
       live-events.js — and this surface takes two things off it: the type, for the
       gold tile, and the payload's text, for the bar. */
    function show(ev) {
        var p = DEMO ? {} : (ev.payload || {});
        var text = DEMO ? DEMO_TEXT : (p.headline || '');
        var detail = DEMO ? '' : (p.detail || '');
        var parts = DEMO ? null : p.parts;
        /* THE THIRD PHRASE — whose bowlers these are. Its club is drawn in the SAME
           strong type as the batting side in the headline, because they are the same
           kind of thing (a club, named) and the eye should pair them across the line;
           the state behind it stays muted like any other supporting clause. Carried
           as parts rather than text for exactly that reason. */
        var tail = DEMO ? null : (p.tail_parts || (p.tail
            ? [{ cls: 'det', text: p.tail }] : null));
        var next = 1 - face;
        segs[next].innerHTML = partsHtml(parts, text) +
            (detail ? '<span class="sep">·</span><span class="det">' + esc(detail) + '</span>' : '') +
            (tail ? '<span class="sep">·</span>' + partsHtml(tail, '', 'tail') : '');
        segs[next].classList.add('on');
        segs[face].classList.remove('on');
        face = next;
        // THE TILE IS THE TYPE. Uppercased by the stylesheet, so the label reads as
        // the table writes it.
        liveLabel.textContent = ev.label || ev.type || '';
        liveEl.classList.toggle('is-long', isLongLabel(ev.label || ev.type));
        /* No `wcc-featured` relay any more. It existed so the strip could follow the
           ticker's current match rather than cycling on its own; both surfaces now
           read the same `wcc-events` broadcast, so a message from one to the other
           about what it is showing is a third account of a fact they already share.
           Removed with the strip's conversion. */
        // Events differ in length, so on the phone the band's height is a property of
        // the one on show.
        reportHeight();
    }

    /* One event in, or none. NONE IS A REAL ANSWER and the bar goes away for it: the
       scheduler found nothing above the floor, which is what an empty afternoon
       actually is. v1 had no way to say this and looped stale scorelines instead. */
    function render(d) {
        var ev = d && d.showing;
        if (!ev) { bar.classList.remove('show'); lastKey = ''; return; }
        bar.classList.add('show');
        // Keyed on the EVENT, not on its text: the same event re-picked after its
        // repeat window is the same thing on screen and must not re-crossfade, while
        // a different event with identical wording (two matches, same score) must.
        var key = ev.id;
        if (key === lastKey) return;
        lastKey = key;
        show(ev);
    }

    /* A HELD CLOCK. The bar no longer has a timer to stop — the dwell is the
       scheduler's and the engine stops broadcasting changes — so all this does now is
       stop what CSS is animating on its own, the pulsing live dot above all. A screen
       described as held has to actually be still, or the word means nothing.
       Production never sees this: only the simulator can hold the clock. */
    function setHeld(held) {
        document.documentElement.classList.toggle('clock-held', held);
    }

    window.addEventListener('message', function (e) {
        var d = e.data;
        if (d && d.type === 'wcc-events') render(d);
        else if (d && d.type === 'wcc-clock') setHeld(!!d.held);
    });
    // Ask the engine for its current answer immediately, so a bar that loads
    // mid-dwell paints without waiting for the next tick (same handshake as the
    // inspector slide's).
    try { window.parent.postMessage({ type: 'wcc-events-request' }, '*'); } catch (e) {}
    try { window.parent.postMessage({ type: 'wcc-clock-request' }, '*'); } catch (e) {}
})();
</script>
</body>
</html>
