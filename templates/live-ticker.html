<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Live ticker</title>
    <style>
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
        :root {
            --navy-1: #0f2346; --navy-2: #0a1c3a; --gold: #d4af37;
            --light-blue: #b4c8e4; --text: #fff; --muted: var(--light-blue); --accent: var(--gold);
            --t-md: 2vw; --t-sm: 1.2vw; --t-xs: 0.9vw;
            /* Match the player's chrome matte (sidebar darker navy) so the footer bar
               and the left strip read as one continuous recessed band. */
            --matte: #08152c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        /* The player sizes this iframe to the bottom footer band (below the retracted
           slide layer) and reveals it there; the bar simply fills it. Transparent
           elsewhere so the stage matte shows through while the bar is hidden. */
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent;
            font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--text); }

        .ticker-bar {
            position: absolute; inset: 0; display: flex; align-items: stretch;
            background: var(--matte); border-top: 0.15vw solid var(--accent);
            opacity: 0; transition: opacity 0.4s ease;
        }
        .ticker-bar.show { opacity: 1; }

        /* The gold flag, bottom-left: the header for the WHOLE live chrome, not just
           the ticker — the strip stands directly above it and has no header of its
           own. Its width is pinned to the live band (the strip's width: this iframe
           spans the stage, so `--live-band` vw lands exactly under the strip), so the
           strip's gold spine runs down into this tile's right edge and the ticker's
           gold top border runs off its left — one continuous L. Keep --live-band in
           step with the players'. */
        .tick-live {
            --live-band: 8vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.15vw; flex-shrink: 0; width: var(--live-band); padding: 0 0.4vw;
            background: var(--accent); color: var(--navy-1);
            font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.05;
            /* Backstop: nothing may spill out of the band and over the gold rule,
               whatever the label turns out to be. */
            overflow: hidden;
        }
        /* The XI label, with the live dot riding INLINE at the head of the text —
           not as a flex sibling — so a two-line name ("U12" / "HURRICANES") keeps
           the dot on its first line instead of leaving it stranded beside a block.
           Clamped to two lines; the division (when there is one) sits beneath. */
        .tick-live-label { font-size: var(--t-sm); letter-spacing: 0.1em;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; }
        /* Long names — "Friendly XI", "U12 Hurricanes", "U11 Incredibles" — step down
           a size and shed most of the tracking. The binding constraint is the longest
           WORD, which can't be broken: at this size an 11-character one still fits the
           band's ~7.2vw of content width. Applied by flagClass() below, on the label's
           actual shape rather than a fixed list of team names. */
        .tick-live.is-long .tick-live-label { font-size: 0.85vw; letter-spacing: 0.03em; }
        .tick-live-sub { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.06em;
            color: rgba(15,35,70,0.75);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; }
        .tick-live-sub:empty { display: none; }
        .tick-live.is-long .tick-live-sub { font-size: 0.8vw; }
        .tick-live i { display: inline-block; vertical-align: 0.04em;
            width: 0.8vw; height: 0.8vw; margin-right: 0.4vw;
            border-radius: 50%; background: #b3261e; }
        .tick-live.is-live i { background: #b3261e; animation: tick-pulse 1.8s infinite; }
        @keyframes tick-pulse {
            0% { box-shadow: 0 0 0 0 rgba(179,38,30,0.6); }
            70% { box-shadow: 0 0 0 0.7vw rgba(179,38,30,0); }
            100% { box-shadow: 0 0 0 0 rgba(179,38,30,0); }
        }

        /* Cycling detail area. Segments fade in place. */
        .tick-body { position: relative; flex: 1; min-width: 0; overflow: hidden; }
        .tick-seg {
            position: absolute; inset: 0; display: flex; align-items: center; gap: 0.8vw;
            padding: 0 1.4vw; font-size: var(--t-md); line-height: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            opacity: 0; transition: opacity 0.35s ease;
        }
        .tick-seg.on { opacity: 1; }
        /* Both sides read white on the live scoreline — no gold hero. */
        .tick-seg .team { font-weight: 900; color: var(--text); }
        .tick-seg .score { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--text); }
        .tick-seg .ov { color: var(--muted); font-size: var(--t-sm); }
        .tick-seg .bat { font-weight: 700; color: var(--text); }
        /* Shared by at-crease batters and the last-wicket line so player names read
           the same everywhere; the trailing figures/dismissal stay muted. */
        .tick-seg .num { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
        .tick-seg .star { color: var(--accent); }
        .tick-seg .lbl { color: var(--muted); font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.06em; }
        /* Provisional-result note — matches today.html's .prov (muted, not uppercase). */
        .tick-seg .prov { color: var(--muted); font-weight: 400; }
        .tick-seg .sep { color: var(--muted); opacity: 0.5; margin: 0 0.3vw; }
    </style>
</head>
<body>
    <div id="ticker" class="ticker-bar">
        <div id="tick-live" class="tick-live is-live">
            <span class="tick-live-label"><i></i><span id="tick-live-text">Live</span></span>
            <span id="tick-live-sub" class="tick-live-sub"></span>
        </div>
        <div class="tick-body">
            <div id="seg-a" class="tick-seg on"></div>
            <div id="seg-b" class="tick-seg"></div>
        </div>
    </div>

<script>
(function () {
    var bar = document.getElementById('ticker');
    var liveEl = document.getElementById('tick-live');
    var liveLabel = document.getElementById('tick-live-text');
    var liveSub = document.getElementById('tick-live-sub');
    var segs = [document.getElementById('seg-a'), document.getElementById('seg-b')];
    var CYCLE_MS = 9000;

    var segments = [];    // current list of {label, html, live} segments
    var idx = 0;          // which segment is showing
    var face = 0;         // which of the two layers is currently 'on'
    var timer = null;
    var lastKey = '';     // avoid restarting the cycle when content hasn't changed
    var lastFeatured;     // last pc_id announced to the chrome (undefined = never)
    var lastFeed = null;  // last feed, so we can re-render once the team map resolves

    // pc_id -> our team label ("1st XI"/"2nd XI"), so the left flag names the match
    // the current segment belongs to instead of a generic "Live". Same-origin config
    // the daily build writes next to the player; a miss falls back to Live/Break.
    // Club NAMES no longer come from here — the feed carries them per innings
    // (`club`) and per result (`result_club`), which is authoritative and needs no
    // string surgery on the team designation.
    // The competition rides alongside, as the flag's subtitle: with no header on the
    // strip above it, this tile names the division for both surfaces. Already
    // shortened to fit the band by the build ("TVCL Div 6C" — see
    // _competition_short), and blank for anything without one (friendlies, cups).
    var PC_TEAM = {}, PC_DIV = {};
    fetch('/live-config.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) {
            ((cfg && cfg.matches) || []).forEach(function (m) {
                if (m.pc_id == null) return;
                PC_TEAM[String(m.pc_id)] = m.team_name || null;
                PC_DIV[String(m.pc_id)] = m.competition_short || m.competition || null;
            });
            if (lastFeed) render(lastFeed);   // relabel a feed that painted before the map loaded
        })
        .catch(function () {});

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function currentInnings(m) { var a = (m && m.innings) || []; return a.length ? a[a.length - 1] : null; }
    function batHtml(b, ours) {
        return '<span class="bat' + (ours ? ' ours' : '') + '">' + esc(b.name) + ' <span class="num">' + (b.runs || 0) +
            ' (' + (b.balls || 0) + ')</span><span class="star">*</span></span>';
    }
    // Spell out dismissals now there's room: "c Smith b Jones" -> "caught Smith,
    // bowled Jones"; "b Jones" -> "bowled Jones"; whole-phrase ones pass through.
    // The special cases below are all real RV output, not hypotheticals:
    //   "c & b M Robinson"        caught and bowled — the fielder IS the bowler
    //   "lbw  b T Duff"           note the double space RV emits after lbw
    //   "ro (H Godden,J Roan)"    run-outs are abbreviated 'ro', never "run out"
    function expandHow(how) {
        var s = String(how || '').trim().replace(/\s+/g, ' ');
        if (!s || /^(run out|not out|retired|hit wicket|timed out|obstruct|handled)/i.test(s)) return s;
        // Run out, with whoever RV credited: "ro (A,B)" -> "run out (A, B)".
        var ro = s.match(/^ro\b\s*(?:\((.*)\))?$/i);
        if (ro) return 'run out' + (ro[1] ? ' (' + ro[1].split(',').map(function (n) { return n.trim(); }).join(', ') + ')' : '');
        // Caught and bowled: one name, said once.
        var cb = s.match(/^c\s*&\s*b\s+(.*)$/i);
        if (cb) return 'caught and bowled ' + cb[1];
        // lbw: the trailing "b X" is the bowler's credit, exactly as in "c X b Y",
        // so it expands the same way. Matched explicitly only because the generic
        // rule below would leave the stray space RV puts after "lbw".
        var lbw = s.match(/^lbw\s+b\s+(.*)$/i);
        if (lbw) return 'lbw, bowled ' + lbw[1];
        return s.replace(/^c\s+/i, 'caught ').replace(/^st\s+/i, 'stumped ')
                .replace(/^b\s+/i, 'bowled ').replace(/\sb\s+/i, ', bowled ');
    }

    // Build the cycle of segments (each tagged with the match's flag label + live
    // state) for the live/break/decided matches in the feed.
    function buildSegments(feed) {
        var shown = (feed && feed.matches || []).filter(function (m) { return m.phase === 'live' || m.phase === 'break' || m.complete; });
        var out = [], anyLive = false;
        shown.forEach(function (m) {
            var team = m.pc_id != null ? PC_TEAM[String(m.pc_id)] : null;
            // Decided match → a result segment (provisional until finalised), no live lines.
            if (m.complete) {
                // `result_club` is the result already phrased with the winning club's
                // name (the Worker owns that, since it owns the feed's quirks).
                var res = m.result_club || m.result || m.leader_text || m.score_text || '';
                if (res) out.push({ label: team || 'Result', live: false, pc: m.pc_id,
                    html: '<span class="team">' + esc(res) + '</span>' + (m.final ? '' : '<span class="prov"> · to be confirmed</span>') });
                return;
            }
            anyLive = true;
            var isBreak = m.phase === 'break';
            var flag = team || (isBreak ? 'Break' : 'Live');
            var inn = currentInnings(m);
            var oc = '';
            // 1) Score + at-crease batsmen, together in one segment (dot-separated).
            if (inn) {
                // The batting side's club name straight from the feed — no guessing
                // which club a team name belongs to. Both sides read white (no gold
                // hero on the live scoreline).
                var sideName = inn.club || inn.side || m.home || '';
                var parts = ['<span class="team' + oc + '">' + esc(sideName) + '</span>' +
                    '<span class="score' + oc + '">' + inn.runs + '/' + inn.wickets + '</span>' +
                    '<span class="ov">(' + esc(inn.overs) + ' ov)</span>'];
                (inn.at_crease || []).forEach(function (b) { parts.push(batHtml(b, false)); });
                out.push({ label: flag, live: !isBreak, pc: m.pc_id, html: parts.join('<span class="sep">·</span>') });
            } else if (m.score_text) {
                out.push({ label: flag, live: !isBreak, pc: m.pc_id, html: '<span class="team">' + esc(m.score_text) + '</span>' });
            }
            // 2) Last wicket — player name styled like the at-crease batters (.bat),
            // the runs/dismissal muted, for a consistent read across segments.
            var w = inn && inn.last_wicket;
            if (w) out.push({ label: flag, live: !isBreak, pc: m.pc_id,
                html: '<span class="lbl">Last wkt</span><span class="bat' + oc + '">' + esc(w.name) + '</span>' +
                    '<span class="num">' + (w.runs != null ? ' ' + w.runs : '') + (w.how ? ' — ' + esc(expandHow(w.how)) : '') + '</span>' });
            // 3) Break, if any.
            if (isBreak && m.break_desc) out.push({ label: flag, live: false, pc: m.pc_id, html: '<span class="lbl">' + esc(m.break_desc) + '</span>' });
        });
        // The flag's subtitle, tagged on here rather than read at show time so a
        // config that lands after the first feed still changes the render key and
        // repaints (see render()).
        out.forEach(function (s) { s.div = s.pc != null ? (PC_DIV[String(s.pc)] || '') : ''; });
        return { segments: out, anyLive: anyLive };
    }

    function stop() { if (timer) { clearInterval(timer); timer = null; } }

    // Does this label need the smaller flag type? Two ways to be too big for the
    // band: too many characters overall, or a single word too long to break —
    // "U12 Hurricanes" wraps happily but "HURRICANES" then has to fit on its own
    // line. Junior sides ("U11 Incredibles") hit both. Deliberately a shape test,
    // not a length-only one, since the label can also be "Result" or a break word.
    function isLongLabel(label) {
        var words = String(label || '').split(/\s+/);
        var longest = 0;
        words.forEach(function (w) { if (w.length > longest) longest = w.length; });
        return String(label || '').length > 9 || longest > 6;
    }

    function showSeg(i) {
        var seg = segments[i] || { label: '', div: '', html: '', live: false, pc: null };
        var next = 1 - face;
        segs[next].innerHTML = seg.html;
        segs[next].classList.add('on');
        segs[face].classList.remove('on');
        face = next;
        // The flag names the match this segment belongs to, and pulses only while live.
        liveLabel.textContent = seg.label;
        liveSub.textContent = seg.div || '';
        liveEl.classList.toggle('is-long', isLongLabel(seg.label));
        liveEl.classList.toggle('is-live', !!seg.live);
        // Tell the rest of the chrome which match is on show, so the strip beside us
        // ladders THIS match's division instead of drifting on its own cycle. The
        // player relays it to the other frames; standalone it simply goes nowhere.
        if (seg.pc !== lastFeatured) {
            lastFeatured = seg.pc;
            try { window.parent.postMessage({ type: 'wcc-featured', pc_id: seg.pc }, '*'); } catch (e) {}
        }
    }

    function render(feed) {
        lastFeed = feed;
        var built = buildSegments(feed);
        if (!built.segments.length) { bar.classList.remove('show'); stop(); lastKey = ''; return; }
        bar.classList.add('show');
        var key = built.segments.map(function (s) { return s.label + '|' + s.div + '|' + s.html; }).join('§');
        if (key === lastKey) return;   // same content — let the running cycle continue
        lastKey = key;
        segments = built.segments;
        idx = 0;
        showSeg(0);
        stop();
        if (segments.length > 1) {
            timer = setInterval(function () { idx = (idx + 1) % segments.length; showSeg(idx); }, CYCLE_MS);
        }
    }

    window.addEventListener('message', function (e) {
        var d = e.data;
        if (d && d.type === 'wcc-live') render(d);
    });
    // Ask the player's live engine for the last feed immediately (same handshake the
    // today board uses), so the bar paints without waiting for the next poll.
    try { window.parent.postMessage({ type: 'wcc-live-request' }, '*'); } catch (e) {}
})();
</script>
</body>
</html>
