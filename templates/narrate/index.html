<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Narrate — Wendover CC</title>
  <style>
    @font-face { font-family: 'Lato'; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
    :root {
      --navy-1: #0f2346; --navy-2: #0a1c3a; --gold: #d4af37; --ink-soft: #b4c8e4;
      --panel: #12294f; --line: rgba(180,200,228,.18); --white: #fff;
      --warn: #f2c96b; --bad: #f0a0a0; --good: #7fd39b;
      /* The beat table's fixed columns, as the deck builder's rows do it: the
         numbers line up down the whole take whatever the captions are doing. */
      --n-w: 30px; --dur-w: 58px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--white);
      background: linear-gradient(165deg, var(--navy-1) 0%, var(--navy-2) 100%);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 9px 18px; border-bottom: 2px solid var(--gold);
      display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; flex-shrink: 0;
      background: var(--navy-2); z-index: 20;
    }
    header h1 { font-size: 17px; font-weight: 900; margin: 0; letter-spacing: .01em; white-space: nowrap; }
    header h1 span { color: var(--gold); }
    .spacer { flex: 1; }
    .status { color: var(--bad); font-size: 12px; white-space: nowrap; }
    .btn { font: inherit; font-weight: 700; padding: 7px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--gold); background: var(--gold); color: var(--navy-2); }
    .btn.ghost { background: transparent; color: var(--gold); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.sm { padding: 4px 9px; font-size: 12px; }
    select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--panel); color: var(--white); max-width: 34ch; font-weight: 700; }

    /* ---- notices: build drift, curation drift, an unfinished take -------- */
    #notices { flex: 0 0 auto; }
    .notice { padding: 8px 18px; font-size: 13px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px; background: rgba(242,201,107,.10); color: var(--warn); }
    .notice.bad { background: rgba(240,160,160,.10); color: var(--bad); }
    .notice .btn { flex: 0 0 auto; }

    /* ---- the take: one waveform, the whole sitting ------------------------ */
    #take-wrap { flex: 0 0 auto; padding: 8px 18px 10px; border-bottom: 1px solid var(--line);
      background: rgba(10,28,58,.5); }
    /* The strip is a scrub surface, not a picture: `touch-action:none` is what
       lets a pointer drag the playhead instead of scrolling the page under it. */
    #wave { width: 100%; height: 74px; display: block; cursor: pointer;
      touch-action: none; background: rgba(255,255,255,.04); border-radius: 6px; }
    .take-meta { display: flex; align-items: center; gap: 14px; margin-top: 6px;
      font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    /* One control, twice: the take's calibration and a cue's correction are the same
       verb, so they are the same instrument — a step, a readout, and a way back. They
       differ only in step size and in what the number means (see narrate.js). Buttons
       rather than a slider because the action is "again, again, again": each press is
       a discrete A/B you can hear land, and holding one repeats. */
    .nudge { display: inline-flex; align-items: stretch; flex: 0 0 auto;
      border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .nudge button { font: inherit; font-size: 12px; font-weight: 700; line-height: 1;
      border: 0; background: transparent; color: var(--gold); padding: 5px 10px; cursor: pointer; }
    .nudge button:hover:not(:disabled) { background: rgba(212,175,55,.14); }
    .nudge button:disabled { opacity: .3; cursor: not-allowed; }
    /* The name and its value are one thing, between the two steps that change it —
       the readout sits where the effect is, rather than trailing the control. */
    .nudge .mid { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
      border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .nudge .cap2 { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--ink-soft); white-space: nowrap; }
    /* Fixed width, so a run of presses does not make the box breathe. */
    .nudge .val { min-width: 6ch; text-align: right; font-size: 12px; color: var(--white);
      font-variant-numeric: tabular-nums; }
    .nudge .val.zero { color: var(--ink-soft); }

    /* The beat table is a fixed-width instrument — its columns do not grow — so on a
       landscape screen every extra pixel goes to the pane where the judging happens:
       the deck itself. */
    main { display: grid; grid-template-columns: minmax(380px, 620px) 1fr; gap: 0;
      flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #beat-pane { display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--line); }
    #beats { overflow-y: auto; flex: 1 1 auto; }
    aside { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: 0 0 auto;
      border-bottom: 1px solid var(--line); background: var(--navy-2); }
    .pane-head .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--gold); white-space: nowrap; }
    .pane-head .count { font-size: 11.5px; color: var(--ink-soft);
      font-variant-numeric: tabular-nums; }
    .pane-head .spacer { flex: 1; }
    .pane-head .btn.sm { padding: 4px 9px; font-size: 12px; }
    /* The beat's name, in the pane that shows it: the same string the row carries,
       set the same way — the levels above it muted, the beat itself in white. */
    .pane-head .cap { font-size: 13px; color: var(--white); flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pane-head .cap i { font-style: normal; color: var(--ink-soft); }
    /* The beat's own actions, where /deck puts a preview's: in the head above it,
       icon and word, so a destructive one has to be read before it is hit. */
    .acts { display: flex; gap: 6px; flex: 0 0 auto; }
    .acts .btn.sm { padding: 4px 9px; font-size: 12px; }
    .acts .btn.rec { border-color: var(--bad); color: var(--bad); }
    .acts .btn.rec.on { background: var(--bad); color: var(--navy-2); }
    #preview-pane { flex: 1 1 auto; min-height: 0; padding: 12px 14px; overflow: hidden; }
    .preview-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
      max-width: calc(72vh * 16 / 9); margin: 0 auto; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--line); }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .preview-none { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: var(--ink-soft); font-size: 13px; padding: 20px; text-align: center; }
    /* ---- beat rows -------------------------------------------------------- */
    .row {
      display: grid; grid-template-columns: var(--n-w) 1fr var(--dur-w);
      align-items: center; gap: 10px; padding: 6px 12px;
      border-bottom: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
    }
    .row:hover { background: rgba(255,255,255,.04); }
    .row.on { background: rgba(212,175,55,.14); }
    .row .n { color: var(--ink-soft); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The levels above the beat are context, not the name: muted, so a list of
       thirty-five reads as thirty-five beats rather than as thirty-five paths. */
    .row .name i { font-style: normal; color: var(--ink-soft); }
    .row .name .card { color: var(--gold); font-size: 11.5px; margin-left: 6px; }
    .row .dur { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .row .dur.redone { color: var(--gold); font-weight: 700; }
    /* Flags are raised without being asked: a silent beat, a cue landing mid-word,
       and a clip beat whose commentary badly overruns its footage. They sit INSIDE
       the row they are about — a warning between two rows belongs to neither. */
    .flags { grid-column: 2 / -1; font-size: 11.5px; color: var(--warn); padding-top: 2px; }
    .flags.bad { color: var(--bad); }
    .empty-hint { color: var(--ink-soft); font-size: 13.5px; padding: 26px 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>Wendover<span>CC</span> · Narrate</h1>
    <select id="take-picker" aria-label="Take"></select>
    <button id="delete-btn" class="btn ghost sm" title="Delete this take">Delete take</button>
    <span class="spacer"></span>
    <span id="status" class="status"></span>
    <button id="export-btn" class="btn">Export narration.zip</button>
  </header>
  <div id="notices"></div>
  <div id="take-wrap">
    <canvas id="wave"></canvas>
    <div class="take-meta">
      <span id="take-when"></span>
      <span class="spacer"></span>
      <span class="nudge" id="nudge-take"
            title="Every cue in the take moves together. It corrects the gap between the recorder starting and the deck's clock starting — a constant for the whole sitting, set once. Hold a button to repeat; shift for a coarser step.">
        <button id="take-back" title="Every cue 10ms earlier (shift: 100ms)">◂</button>
        <span class="mid"><span class="cap2">Nudge take</span><span class="val zero" id="take-off-val">0ms</span></span>
        <button id="take-fwd" title="Every cue 10ms later (shift: 100ms)">▸</button>
      </span>
    </div>
  </div>
  <main>
    <div id="beat-pane">
      <div class="pane-head">
        <span class="lbl">Beats</span>
        <span class="count" id="beat-count"></span>
        <span class="count" id="take-clock">0:00 / —</span>
        <span class="spacer"></span>
        <button id="play-btn" class="btn ghost sm">Play ▸</button>
      </div>
      <div id="beats"><div class="empty-hint">Loading…</div></div>
    </div>
    <aside>
      <div class="pane-head">
        <span class="lbl">Beat</span>
        <span class="cap" id="beat-title">Nothing selected</span>
        <span class="acts">
          <span class="nudge" id="nudge-cue"
                title="Where this beat begins in the take. It moves one boundary, so it reflows this beat and the one before it — the mid-word fix. Hold a button to repeat; shift for a coarser step.">
            <button id="cue-back" title="Start this beat 10ms earlier (shift: 100ms)">◂</button>
            <span class="mid"><span class="cap2">Nudge cue</span><span class="val zero" id="cue-off-val">0ms</span></span>
            <button id="cue-fwd" title="Start this beat 10ms later (shift: 100ms)">▸</button>
          </span>
          <button id="redo-btn" class="btn ghost sm rec" title="Record this beat again">⏺ Re-record</button>
          <button id="undo-btn" class="btn ghost sm" title="Drop the re-record and go back to the take" hidden>↺ Undo</button>
        </span>
      </div>
      <div id="preview-pane">
        <div class="preview-wrap">
          <!-- The deck, hosted. Review drives the player's own nav (`?hosted`) rather
               than a second addressing scheme, so a beat is reached exactly the way
               the narrator reached it. -->
          <iframe id="preview" title="Deck" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
          <div class="preview-none" id="preview-none">Pick a beat to see it.</div>
        </div>
      </div>
    </aside>
  </main>
  <audio id="take-audio" preload="auto"></audio>
  <script src="/assets/js/deck-store.js?v={{ asset_version }}"></script>
  <script src="/assets/js/take-store.js?v={{ asset_version }}"></script>
  <script src="/assets/js/zip.js?v={{ asset_version }}"></script>
  <script src="/assets/js/narrate.js?v={{ asset_version }}"></script>
</body>
</html>
