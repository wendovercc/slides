           short panel's apertures come out a shade TALLER than a ladder tile rather
           than a shade shorter. That is the side of the line to be wrong on — the
           figures are what the panel is for. Same for the closed-innings line, which
           is also content-sized now. */
        var BADGE_FLEX = 1.8, LINE_FLEX = 1;
        function putTeam(g, t) { putFixed(g, tile(t, BADGE), BADGE_FLEX); }
        /* `inns` arrives in batting order, so the block for the innings ON SHOW is the
           one that goes in the box and `other` is the side watching it. Which of the two
           comes first on screen never changes — the side that batted first is always on
           top — so the box moves down the column at the innings break. */
        var box = block(), other = block(), boxFirst = true;

        if (inns.length >= 2) {
            /* SECOND INNINGS. The first block is settled by construction — a new
               innings only exists because the previous one closed — so its figures
               take the quieter treatment whether or not the match is over. */
            var first = inns[0], cur = inns[inns.length - 1];
            /* WHO IS IN, and it has to be an OPEN innings — at the close nobody is,
               which is the board's rule for its own batting recess. So the chasing
               side's figures sink while the game runs and come back up settled. */
            var inNow = !done && !cur.closed;
            // The side that batted first is now bowling, so its block is the one
            // OUTSIDE the box — and it still comes first, being the side that batted
            // first. The box is therefore the lower of the two.
            boxFirst = false;
            putTeam(other, tiles[0]);
            putFixed(other, scoreTile(first), LINE_FLEX);
            if (tiles[1]) putTeam(box, tiles[1]);
            put(box, statTile(cur.runs || 0, 'Runs', { gold: true, done: done, batting: inNow }));
            put(box, statTile(cur.wickets || 0, 'Wickets', { gold: true, done: done, batting: inNow }));
            put(box, statTile(oversOf(cur), 'Overs', { done: done, batting: inNow }));
            var stats = chaseStats(card);
            /* THE SWINGOMETER'S TWO CHANNELS COME STRAIGHT OFF THE CHASING SIDE'S
               TILE, which is `tiles[1]` by construction (`matchTiles` puts the side
               that batted first on top). Deliberately not a second call into the
               chase model: `assess` has already priced this side — from
               `WccChase.chaseState` while the game runs, from the feed's own verdict
               once it is decided — and has already mirrored it onto this side. Asking
               again would be a second opinion where the whole point is that the
               ladder, the board and this tile give one.

               It also settles the result state for free. The board drops its
               apertures at the close and posts a verdict badge instead; the strip has
               no badge, so the tile keeps the fill and `assess` makes it a full one in
               the outcome's colour — certainty 1, which is what a decided match is. */
            var chasing = tiles[1] || {};
            if (stats) {
                var ct = chaseTiles(stats, { lean: chasing.lean, certainty: chasing.certainty },
                                    inNow);
                put(box, ct.html, ct.count);
            }
        } else {
            /* FIRST INNINGS, and the pre-match card too: with no innings at all
               (the toss is in, nobody has faced a ball) there are no figures to
               write, so the panel is the two sides and their glyphs — which is the
               honest state, and the same one the tiles are already in. */
            putTeam(box, tiles[0]);
            if (inns.length) {
                var f = inns[0];
                var settled = f.closed || done, inFirst = !settled;
                put(box, statTile(f.runs || 0, 'Runs', { gold: true, done: settled, batting: inFirst }));
                put(box, statTile(f.wickets || 0, 'Wickets', { gold: true, done: settled, batting: inFirst }));
                put(box, statTile(oversOf(f), 'Overs', { done: settled, batting: inFirst }));
                var rr = rateOf(f.runs, f.overs);
                if (rr != null) put(box, statTile(rr, 'Run rate', { done: settled, batting: inFirst }));
            }
            if (tiles[1]) putTeam(other, tiles[1]);
            /* THE SIDE STILL TO BAT. Once the first innings has closed the slot has
               a figure to carry instead of a label — the target, which is the whole
               news of the interval and is otherwise unsaid until the chase begins.
               `targetOf` is null while they're still batting, which is exactly when
               "TO BAT" is the only true thing to write. */
            var target = inns.length ? targetOf(card) : null;
            if (target != null) put(other, statTile(target, 'To win', {}));
            else if (inns.length) put(other, noteTile('To bat'));
        }
        /* ASSEMBLY — ONE SCOREBOX AROUND THE WHOLE MATCH.
           > James's direction, 2026-09-28.

           The housing is the pale shade the apertures are sunk into, and it goes around
           BOTH sides: the match-day tile is one panel in one shade with apertures cut
           into it, and this column is that tile stood on its end. It used to wrap the
           innings on show alone, with the side watching left on the matte — pale meant
           "batting" — which made the box a second way of saying what the dimmed figures
           already say. The apertures keep that job — they are cut on the batting side
           only, as the board cuts its own — and the shade is just the board.

           THE HOUSING IS BEHIND THE GAPS, not just the tiles, which is the whole reason
           it is a wrapper: light shows around every aperture, so a run of them reads as
           separate apertures in a scorebox instead of one continuous recess.

           OUTSIDE IT: the trailing spacer and the header, on the matte. So the box is
           exactly as tall as the match has figures, and the chrome at either end stays
           chrome instead of becoming the scoreboard's own edge.

           Each part takes its own shares, so every tile keeps the height it had when
           they were all the column's own children. The spacer takes whatever the
           ladder's ten tiles would have had, so a short panel's tiles stay the ladder's
           height instead of stretching. A full panel gets none at all — a flex:1 spacer
           beside ten flex:1 tiles would make every tile an eleventh of the column and
           put the whole panel out of step with the ladder it shares the band with. */
        var r2 = function (n) { return Math.round(n * 100) / 100; };
        /* A pre-match card has no figures in it at all — the two sides and nothing
           else — and it still gets the box: what the housing says is "this is the
           scoreboard", and an empty board is a board. Each side keeps its own wrapper
           inside it, so their tiles are one width and each takes exactly the height its
           own figures need. */
        function wrap(g) {
            /* A block with figures in it takes its share of the column; one without
               takes only its content, so the side watching can never hold height the
               side batting could be using. */
            var f = g.flex ? r2(g.flex) : '0 0 auto';
            return '<div class="blk" style="flex:' + f + '">' + g.html + '</div>';
        }
        var used = box.used + other.used;
        /* THE SPACER GOES INSIDE THE BOX. A first innings is seven or eight tiles in a
           column built for ten, and the slack used to sit below the scorebox on the
           matte — which left the panel looking like a short board floating above a
           dark shelf. Inside, the housing runs the full height whatever the match has
           to put in it, and the slack is simply the empty bottom of the scoreboard,
           which is what an unfinished board looks like anyway.
           > James's direction, 2026-09-28.

           The box therefore always takes the whole column above the footer, and the
           ten-share arithmetic moves inside it: the spacer holds whatever the tiles
           don't, so they keep the ladder's height instead of stretching. */
        var out = (boxFirst ? wrap(box) + wrap(other) : wrap(other) + wrap(box));
        if (used < 10) out += '<div class="spacer" style="flex:' + r2(10 - used) + '"></div>';
        return '<div class="sbox" style="flex:1">' + out + '</div>';
    }

    function render() {
        /* NO PICK, NO CHROME. The scheduler found nothing above the floor, which is
           the honest state of an empty afternoon — the same collapse the ticker does,
           and the whole reason "nothing" became sayable in v2.

           Only once an event stream has actually spoken, though: a page whose engine
           is older than itself (the asset-cache-skew trap) or the standalone
           `/live-strip/?sim=…` harness, which fabricates the two feeds but no events,
           would otherwise show an empty column for ever. Those fall through to the
           first view on its baked panel, which is what that page is for — looking at
           tiles, not at scheduling. */
        var ev = showing, view, fx, panel;
        if (ev) {
            view = viewForEvent(ev);
            fx = fixtureForEvent(view, ev);
            panel = view ? panelFor(ev, view, fx) : 'none';
        } else if (haveEvents) {
            root.classList.remove('show'); lastKey = ''; return;
        } else {
            view = VIEWS[0] || null;
            fx = view ? (view.fixtures || [])[0] : null;
            panel = view ? (view.mode === 'league' ? 'ladder' : 'score') : 'none';
        }
        if (!view) { root.classList.remove('show'); lastKey = ''; return; }

        var body = '';
        if (panel === 'ladder') {
            var rows = leagueTiles(view);
            // Wrapped, not passed bare: `map` would hand the INDEX to tile()'s
            // second argument, which is now the dialect.
            body = rows.length ? rows.map(function (r) { return tile(r); }).join('') : '';
        } else if (panel === 'score') {
            body = scorePanel(view, fx);
        }
        /* 'none' leaves the band to the footer alone — an event with no match behind
           it, or one whose match this strip has no view for. Deliberately not a
           collapse: the L is still describing something, and pulling the column out
           from under the tile would break the frame mid-sentence. */
        if (!body && panel !== 'none') { root.classList.remove('show'); lastKey = ''; return; }

        // The panel fills whatever is left above the footer, which is anchored to the
        // bottom. That way the edge that MOVES as the panel's content changes is its
        // top — furthest from the corner the eye is reading. The scoreboard's footer
        // is the division alone; the ladder's is the XI over it.
        var html = body + footer(view, ev, { divOnly: panel === 'score' });
        if (html === lastKey) return;   // nothing changed — leave the DOM (and its transitions) alone
        lastKey = html;
        var before = tilePositions();
        root.innerHTML = html;
        playMoves(before);
        root.classList.add('show');
    }

    // ---- feeds in ------------------------------------------------------------
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d) return;
        if (d.type === 'wcc-live') {
            // Past the engine's grace window a failed poll broadcasts no matches at
            // all. Drop what we hold rather than laddering a frozen picture — a
            // silent-feed dot is honest, a stale fill isn't.
            if (!d.matches) liveByPc = {};
            (d.matches || []).forEach(function (m) { if (m.pc_id != null) liveByPc[String(m.pc_id)] = m; });
            render();
        } else if (d.type === 'wcc-league') {
            lastLeague = d;
            (d.matches || []).forEach(function (m) { if (m.match_id != null) leagueById[String(m.match_id)] = m; });
            render();
        } else if (d.type === 'wcc-events') {
            /* THE SCHEDULER'S ANSWER — which event the whole L is describing. The
               strip takes its subject and its panel from this and nothing else.
               `showing` null is a real answer (the chrome collapses), which is why
               the flag is set before the null check rather than on a truthy pick. */
            haveEvents = true;
            showing = d.showing || null;
            render();
        } else if (d.type === 'wcc-clock') {
            setHeld(!!d.held);
        }
    });
    // Ask the engine for the last of each feed at once, so a mid-interval load
    // paints without waiting a whole poll cycle (same handshake as the ticker).
    try { window.parent.postMessage({ type: 'wcc-live-request' }, '*'); } catch (e) {}
    try { window.parent.postMessage({ type: 'wcc-league-request' }, '*'); } catch (e) {}
    try { window.parent.postMessage({ type: 'wcc-events-request' }, '*'); } catch (e) {}
    try { window.parent.postMessage({ type: 'wcc-clock-request' }, '*'); } catch (e) {}

    /* A HELD CLOCK. There is no view cycle left to stop — the strip's twenty-second
       rotation went with the conversion, since what is on the band is now the
       scheduler's pick and a second timer beside it would only drift. So this stops
       what CSS is animating on its own, the ladder's FLIP transitions above all, and
       a held screen is actually still. Only the simulator can hold the clock. */
    function setHeld(held) {
        document.documentElement.classList.toggle('clock-held', held);
    }

    render();

    // Off-day testing: /live-strip/?sim=league|friendly drives the real feed
    // handlers above from a simulated match, so what's exercised is the shipping
    // render path, not a parallel mock.
    var sim = new URLSearchParams(window.location.search).get('sim');
    if (sim) {
        window.WCC_STRIP_VIEWS = VIEWS;
        var s = document.createElement('script');
        s.src = '/assets/js/live-strip-sim.js?v={{ asset_version }}';
        s.setAttribute('data-sim', sim);
        document.body.appendChild(s);
    }
})();
</script>
</body>
</html>
