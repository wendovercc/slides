<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Live strip</title>
    <style>
        /* 400 IS LOAD-BEARING, not a spare. The slide base loads it and the board's
           captions (`.sb-label`, `.sb-wait`) are set in it; this column declared only
           700 and 900, so anything asking for 400 was matched to the 700 face and every
           caption here came out a weight heavier than the same caption on the board.
           > James's observation, 2026-09-28. */
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
        :root {
            --gold: #d4af37; --text: #fff; --matte: #08152c;
            /* THE BOARD'S OWN TOKENS, by value: the strip is a separate document with
               no access to the slide base's `:root`, so the two surfaces agree by
               being written the same rather than by sharing a file. `--muted` is the
               wall's secondary-label blue (`--light-blue`), which every caption on the
               match-day board uses and which this column was still writing as a
               translucent white; `--radius` is the radius its apertures are cut with. */
            --muted: #b4c8e4; --radius: 0.4vh;
            /* The gold spine down the strip's INNER edge, which meets the ticker's
               gold top border at the bottom-left corner so the two chrome surfaces
               read as one L-shaped frame. Same on-screen thickness as that border
               (0.15vw of the STAGE): this iframe is only the live band wide, so a
               stage vw is 1/0.08 of a strip vw — hence 0.15 / 0.08. Keep in step
               with --live-band in the players and .ticker-bar's border-top. */
            --rule: 1.875vw;
            /* Match the points badges elsewhere (--accent-win / --accent-loss). */
            --win: 45, 122, 45; --loss: 139, 26, 26;   /* rgb triples */
            /* THE SCOREBOX AND ITS APERTURES — the match-day board's scoreboard, in
               this column's terms.

               `--housing` is what the board's `.sb` sits on: its match tile's
               `rgba(255,255,255,0.05)` over the slide's navy, stated here as the colour
               it composites to so the two surfaces match whatever each is layered on.
               `--aperture` is the board's `.sb-cell` exactly — "digits sunk into a dark
               panel, as they are on a board: the figure is what carries, the housing
               recedes."

               ONE DECLARATION DOES TWO OF THE BOARD'S JOBS HERE, because on this
               surface they coincide: the board's aperture (`.sb-cell`, a figure that is
               still moving) and its batting recess (`.sq-bat`, "a recess is the same
               thing the scoreboard's apertures do with the figures that matter"). The
               figures still moving ARE the batting side's, so one dark tone says both.

               THE GAPS ARE THE HOUSING, which is the whole point of putting the pale
               shade behind the tiles rather than under the whole column: light shows
               around every dark tile, so a run of them reads as separate apertures in a
               scorebox instead of one continuous recess. */
            --housing: #162744; --aperture: rgba(0,0,0,0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent;
            font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--text); }

        /* The column reveals with the rest of the live chrome. It carries no header:
           what names the match is the FOOTER at its bottom end (`.foot`), sitting
           directly on the gold tile below, which now carries the event type rather
           than the team. */
        .strip {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            background: var(--matte);
            border-right: var(--rule) solid var(--gold);
            /* No padding at all: tiles run edge to edge, from the frame across to
               the gold spine, and top to bottom from the frame down onto the
               ticker's gold rule — the spine already runs the full height, and the
               slide beside the strip starts flush at the top, so any inset here
               leaves both ends of the column short of the chrome it belongs to.
               The GAP stays, and stays matte: fill height is the certainty channel,
               so without a break two adjacent settled tiles merge into one
               double-height fill and stop being countable. A rule instead of a gap
               would read as a table border and compete with the spine. */
            padding: 0; gap: 0.4vh;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .strip.show { opacity: 1; }

        /* One equal-height tile per team, ordered by league position. Channels:
           - FILL colour   = result lean (green win / red loss), always the full points colour
           - FILL height   = certainty (a band rising from the bottom; full tile = settled)
           - bat/bowl ICON = live role (top-left)
           - GHOST arrow   = a pending, not-yet-committed move up/down the table
           Role/dot top-left, ghost arrow bottom-right, TLA centred; text stays white on
           either the dark base or the full colour, so contrast never drops. */
        .tile {
            position: relative; flex: 1; min-height: 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.06);
        }
        /* Certainty fill: full points colour, rising from the bottom to `height`. */
        .fill { position: absolute; left: 0; right: 0; bottom: 0; z-index: 0;
            transition: height 0.6s ease; }
        .tla { position: relative; z-index: 1;
            font-size: 3.2vh; font-weight: 900; letter-spacing: 0.02em; text-align: center; }

        /* THE SIDE, in the SCOREBOARD only (`.tile.badge`) — never in the ladder, where
           ten of these down an 8vw column would be unreadable and position, not
           identity, is the point.

           THE MATCH-DAY BOARD'S HEAD, STACKED. That tile writes crest, CLUB, then the
           XI under it, and this one now says the same three things in the same order —
           the column is 8vw rather than a third of a slide, so they go one above the
           other instead of side by side. It carried the XI alone for a while, on the
           reasoning that the crest had already said the club; but four of the
           twenty-five clubs in our divisions have no cached badge, a badge is only the
           club to someone who already knows it, and the wall's other live surface was
           spelling the name out regardless. One identity, written once, in both places.
           > James's direction, 2026-09-28.

           THE XI IS STILL THE LINE THAT MATTERS on a division afternoon — which Denham
           this is — so it keeps its own line under the club rather than being folded
           into it, exactly as `.sb-desig` sits under `.sb-team`.

           IT TAKES ONLY THE HEIGHT IT NEEDS. Every other tile in the column is a flex
           share of what's going; a heading tile is `auto`, so it is exactly crest plus
           two lines plus its padding and not a pixel more. It used to take a fixed 1.8
           shares, which on a tall panel left a band of empty tile under the XI and
           pushed the score away from the name it belongs to. Content-sized, the name
           sits ON the figures the way `.sb-head` sits on the board's apertures — and
           every bit of the slack it was holding goes to the apertures instead.
           > James's direction, 2026-09-28. */
        /* Asymmetric padding, and on purpose: a little air ABOVE the crest so the
           heading is not jammed against the tile above it (or, on the first block,
           against the top of the column), and almost none below, where the tile's job
           is to sit on the figures it heads. */
        .tile.badge { flex: 0 0 auto; flex-direction: column;
            gap: 0.25vh; padding: 1.2vh 0.35vh 0.25vh; }
        /* THE TEAM TILE IS A HEADING FOR THE FIGURES UNDER IT, so it sits closer to
           them than the apertures sit to each other: the block's own 0.7vh gap is
           pulled most of the way back, and what is left reads as the join between a
           name and its score rather than as another aperture boundary. The badge tile
           is always its block's first child, so this only ever tightens that one seam
           — and it has to move with the gap above, which is why the two numbers appear
           together here. */
        .sbox .tile.badge { margin-bottom: -0.6vh; }
        /* The club's own crest idiom, as `.sb-crest` and `.crest img` have it
           everywhere else on the wall: contained in a white disc. The white is
           load-bearing, not decoration — the cached badges are transparent PNGs drawn
           for light backgrounds, and several are dark line art that would vanish on
           the matte. `object-fit: contain` inside a square so a non-square badge is
           never cropped or stretched. `flex-shrink: 0` so the name lines can never
           squeeze it out of round. */
        .tile.badge img { position: relative; z-index: 1; flex-shrink: 0;
            width: 7vh; height: 7vh; border-radius: 50%; object-fit: contain;
            background: #fff; padding: 0.4vh; box-sizing: border-box; }
        /* THE CLUB — `.sb-team`'s job, and set the way that line is set: white, heaviest
           weight, AS IT IS WRITTEN. No uppercasing and no tracking — a club has a name,
           not a label, and "Penn & Tylers Green CC" in caps is both wider and less
           recognisable than the name on its own scorebook. The strip's other short
           strings (the TLA, the captions, the footer) stay uppercase; these two lines
           belong with the board's, not with the chrome's.
           > James's direction, 2026-09-28.
           WRAPS TO TWO LINES rather than ellipsing, since "Penn & Tylers Green CC" has
           no honest one-line form at this width and a break between words costs
           nothing. Clamped at two so a pathological one cannot push the crest out. */
        .bclub { position: relative; z-index: 1; text-align: center;
            font-size: 1.7vh; font-weight: 900; line-height: 1.05;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; max-width: 100%; }
        /* THE XI — `.sb-desig`'s job, set the same way: the board's muted blue, a step
           down, under the club, and again as it is written ("1st XI", not "1ST XI"). Two lines allowed for the junior designations ("Under 15 Spitfires",
           "Under 10 - Hurricanes"), which at this width have no one-line form either
           and read worse clipped than wrapped. */
        .bname { position: relative; z-index: 1; text-align: center;
            font-size: 1.4vh; font-weight: 700; line-height: 1.1;
            color: var(--muted); opacity: 0.8;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; max-width: 100%; }
        /* Long names step down; the binding constraint is the longest WORD, which
           cannot be broken. See badgeIsLong — the panel decides it for both tiles, so
           two sides of one scoreboard are never set at two different sizes. */
        .tile.badge.is-long .bclub { font-size: 1.4vh; }
        .tile.badge.is-long .bname { font-size: 1.2vh; }

        /* Friendly view: the same tiles as the league view, but only two of them,
           each capped at the 10-tile height with empty space below (the spacer takes
           the remaining flex share). */
        .spacer { flex: 8; min-height: 0; }

        /* FIGURE TILES: one full-size tile per number (same footprint as a team
           tile), value over caption. These are what make the `score` panel a
           vertical scoreboard — an innings is a team tile followed by its figures,
           read top to bottom the way the ticker reads left to right. */
        /* FIGURE OVER CAPTION, which is now the match-day board's arrangement too —
           the board's apertures were labelled above and have been turned over to sit
           this way round, since the figure is what an aperture is for and the caption
           only names it. This column was already right; it is the one the board moved
           to. */
        .stat-tile { flex-direction: column; gap: 0.3vh; }
        /* Positioned, like `.tla`, so the figure stays on top of its own swingometer
           fill: an absolutely positioned child with `z-index: 0` would otherwise
           paint over static siblings. Same fix as the board's
           `.sb-cell > .sb-label, .sb-cell > .sb-num`. */
        .cval, .clabel { position: relative; z-index: 1; }
        /* THE FIGURE FILLS ITS APERTURE. It is the one thing in the column a viewer is
           actually reading a score off, and the headings and the closed-innings line
           giving up their slack left the apertures tall enough to carry it larger.
           Bounded by the BAND's width rather than by the tile's height: three digits
           and a decimal point ("24.3") is the widest a labelled figure ever gets, and
           at this size that still clears the gold spine.
           > James's direction, 2026-09-28. */
        .cval { font-size: 4.2vh; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        /* The board's `.sb-label`, declaration for declaration: its blue, its tracking,
           its opacity and its WEIGHT. The weight was 700 here for a while on the
           argument that a 1.4vh caption needs more body than the board's ~2vh one —
           but the board's is 400 and the two sat side by side on the same wall looking
           like two different type systems. Size is the thing this column is short of;
           weight is not the way to buy it back. */
        .clabel { font-size: 1.4vh; font-weight: 400; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--muted); opacity: 0.65; }

        /* THE SCORE ITSELF IS GOLD — total and wickets, and nothing else in the
           column. Gold is the one accent here (see docs/design-conventions.md), so
           it goes on the headline figure and the rest of the scoreboard — overs,
           rate, what's needed — stays white. That is also what binds a team tile to
           its two figures without a box or a tighter gap: the gold pair IS the
           score line, so the eye groups them without being told. */
        .stat-tile.gold .cval { color: var(--gold); }

        /* A tile with a caption and no figure: "TO BAT" under the side yet to come
           in. The label carries the whole tile, so it sits up from caption size and
           brightness towards the team tiles it sits among. */
        .stat-tile.note .clabel { font-size: 1.7vh; color: rgba(255,255,255,0.75);
            letter-spacing: 0.08em; }

        /* A CLOSED INNINGS IS ONE FIGURE, NOT TWO — "253/6", the way the match-day
           board writes a settled innings on its `.sb-line` and the way every other
           tile on the wall writes a finished score. Runs and wickets in separate
           labelled apertures is how a board reports an innings that is still moving;
           once it has closed the pair is a single statement, and "RUNS" and "WICKETS"
           under it name what everyone reading a cricket score already knows.

           It also buys the column a whole tile back, which goes to the innings that
           IS moving — the chase's apertures get taller for it.
           > James's direction, 2026-09-28.

           AND IT IS A LINE, NOT AN APERTURE — content-sized like the heading above it,
           for the same reason and with the same effect. The board's `.sb-line` is one
           line's height directly under the club it belongs to; a full tile's share
           here stood the figure in the middle of a tall empty box, a clear 3vh below
           the name whose innings it was. Sized to its content it tucks under the head,
           and the share it was holding goes to the innings still being played.

           A STEP DOWN FROM THE APERTURES' OWN FIGURES, because "253/10" is twice the
           width of anything they hold — and quieter suits it anyway, this being the
           innings that has finished. `nowrap` so it can never break at the slash. */
        .stat-tile.line { flex: 0 0 auto; padding: 0.15vh 0 0.4vh; }
        .stat-tile.line .cval { font-size: 3.2vh; white-space: nowrap; }
        /* AND IT IS FULL GOLD, not the dimmed gold every other settled figure takes.
           The board's `.sb-fig` writes a closed innings at `var(--accent)` flat, and it
           can afford to because the FORM has already said the innings is over — a line
           instead of an aperture, no label, no housing. This tile is that same line, so
           the dimming would be saying it twice and would leave the one finished score
           on the panel looking like stale data. `.done` still dims the labelled figures,
           which have no other way to say it. */
        .stat-tile.line.gold.done .cval { color: var(--gold); }

        /* THE FOOTER: whose match this panel is about, in the band directly above the
           gold tile.

           IT CARRIES DIFFERENT THINGS ON THE TWO PANELS. The ladder's is the XI over
           the division, as it always was — ten three-letter abbreviations name nobody.
           The SCOREBOARD's is the DIVISION ALONE (`.foot.solo`): its own team tiles
           now spell out the club and the XI, so repeating the XI here was the same
           fact twice in an 8vw band. It was tried at the TOP of the scoreboard, over
           the figures the way the match-day board heads its tiles, and put back —
           the bottom is where the L joins and where the attribution belongs.
           > James's direction, 2026-09-28.

           The strip used to have no header of any kind, deliberately — the gold tile
           below it named the featured XI and its division for both surfaces. The tile
           now carries the EVENT TYPE instead (see live-ticker.html), so the
           attribution comes back here.

           BOTTOM, not top, and that is the whole point of it. At the top of a
           full-height column it would sit the better part of a screen away from the
           tile and the bar it belongs with, and read as a separate object; at the
           bottom the three parts of the L are one cluster in the corner, and the
           attribution lands on both paths out of it — up the side and along the
           bottom. It also puts the naming block at the terminus of the gold spine,
           where the L actually joins.

           Fixed height and `flex-shrink: 0`, like `.panel-cap`, so it takes no share
           of the tile flex: ten league tiles lose a little height rather than the
           footer being squeezed. Solid on the matte with a hairline over it so it
           reads as the foot of the column and not as a gap in it. */
        .foot {
            flex-shrink: 0; padding: 0.55vh 0.4vh 0.7vh;
            border-top: 0.15vh solid rgba(255,255,255,0.18);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.2vh; text-align: center; overflow: hidden;
        }
        .foot-team {
            font-size: 1.7vh; font-weight: 900; letter-spacing: 0.04em;
            text-transform: uppercase; line-height: 1.05;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Long XI names — "U11 Incredibles" — step down, exactly as the gold flag did
           when it was carrying them. The binding constraint is the longest WORD,
           which cannot be broken. */
        .foot.is-long .foot-team { font-size: 1.35vh; letter-spacing: 0.01em; }
        .foot-div {
            font-size: 1.25vh; font-weight: 700; letter-spacing: 0.05em;
            color: var(--muted); opacity: 0.75; line-height: 1.1;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .foot-div:empty { display: none; }
        /* The division standing alone on the scoreboard's footer: a step up, since it
           is the only line there and no longer a caption under a name. */
        .foot.solo .foot-div { font-size: 1.4vh; letter-spacing: 0.06em; opacity: 0.85; }

        /* Chase-panel caption. Only shown once the match is over, naming the block
           so final numbers can't read as a chase still in progress — muting alone
           would be ambiguous (it looks like stale data). Fixed height like the
           header, so it doesn't take a share of the tile flex. */
        .panel-cap { flex-shrink: 0; height: 2.4vh;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3vh; font-weight: 900; letter-spacing: 0.14em;
            text-transform: uppercase; color: rgba(255,255,255,0.5); }
        /* SETTLED FIGURES read quieter than live ones — a touch dimmer, and flush on
           the housing rather than sunk in an aperture (see `.sbox`). Two things are
           settled: every figure of a finished match (under
           the FINAL caption), and a CLOSED innings while the next one is running,
           which is the first-innings block during a chase. Same treatment for both,
           because they mean the same thing — this number cannot change again — and
           it is what keeps the live half of a chase the brighter one. Gold dims as
           gold; it must not fall back to white here, or a closed innings would stop
           looking like a score. */
        .stat-tile.done .cval { color: rgba(255,255,255,0.78); }
        .stat-tile.gold.done .cval { color: rgba(212,175,55,0.78); }

        /* ── THE SCOREBOX ─────────────────────────────────────────────────────
           The pale housing the score panel's tiles sit in, so the dark apertures read
           as sunk into something. Only the score panel has one: the ladder is ten
           equal tiles on the matte and has no scoreboard to be the housing OF.

           IT IS THE WHOLE SCOREBOARD'S BACKGROUND, both sides of it. For a while it
           wrapped only the innings on show, with the side watching left on the matte —
           pale meant "batting", and the apertures inside it meant it a second time.
           The match-day tile is one panel in one shade with apertures cut into it where
           the side batting has figures, and this column is meant to be that tile stood
           on its end. So the housing runs behind both blocks and the gap between them,
           and the APERTURES alone say who is in.
           > James's direction, 2026-09-28.

           IT WRAPS THE TILES, not the column. The matte still runs behind the header
           and behind the trailing spacer, so the scorebox is exactly as tall as the
           match has figures to put in it — and the chrome at either end stays chrome
           rather than becoming the top and bottom of the scoreboard.

           PADDING, so the housing shows on all four sides of every aperture. Without
           it the dark tiles bleed to the column's edges and the separation is only
           horizontal. */
        /* THE HOUSING SHOWS AS MUCH AS THE BOARD'S DOES. The gap and the padding are
           one number — what separates two apertures has to be what separates an
           aperture from the edge of the box, or the top one looks glued to the rim —
           and it is set from the board's own `.sb-grid` gap, which is a comfortable
           band of housing rather than a hairline. At 0.4vh the apertures were running
           together into one recess; the whole point of the pale shade is that light
           shows all the way round each of them. */
        .sbox { display: flex; flex-direction: column; gap: 0.7vh; min-height: 0;
            padding: 0.7vh; background: var(--housing);
            /* IT RUNS INTO THE FOOTER. The column puts 0.4vh between every pair of its
               children, which is right between two ladder tiles and wrong here: it left
               a thread of matte between the bottom of the scorebox and the rule over
               the division, so the board looked as though it had come loose from the
               thing naming it. Pulled back to nothing, the housing meets that rule and
               the footer reads as the scoreboard's own caption. */
            margin-bottom: -0.4vh; }
        /* The two blocks — one per side. They carry the flex shares and nothing else
           now that the housing is the box's: a wrapper each is still what keeps every
           tile one width and lets a side take exactly the height its own figures need.
           No padding of their own, or the gap between the sides would be double. */
        .blk { display: flex; flex-direction: column; gap: 0.7vh; min-height: 0; }
        /* THE TILES GIVE UP THEIR OWN BACKGROUND and take the board's two states
           instead: a team tile sits flush on the housing (the board's `.sb-head` does,
           over the tile's own fill), and so does a SETTLED figure — which is the board's
           own grammar for one, a closed innings being "stated on a line beneath" rather
           than in an aperture. Left as `.tile`'s own `rgba(255,255,255,0.06)` they
           composited to a fourth shade that was neither the matte nor the housing. */
        .sbox .tile { background: transparent; }
        /* WHO IS IN — the aperture, and ONLY on the figures of the side currently
           batting, which is what the match-day board does with its own (`.sb-cell` on
           the batting zone, `.sq-bat` on the small tiles, neither shown on a decided
           game). It has to out-specify the transparency above, which is why it is
           scoped to the box rather than standing on `.stat-tile.batting` alone.

           ONLY WHILE AN INNINGS IS OPEN. At the interval and at the close nobody is in,
           so nothing is sunk. Which makes the pair legible without a legend: sunk means
           live figures, flush-and-dimmed means figures that cannot change. */
        .sbox .stat-tile.batting { background: var(--aperture); border-radius: var(--radius); }

        /* Our team: a thick gold bar down the tile's left edge. A real border, not
           an inset shadow: the tile now reaches the frame, so there is no gutter
           left to hang an outside bar in — and an INSET shadow would be painted
           under the .fill child and disappear as certainty rose. The border also
           holds the fill off it, since an absolutely positioned child resolves
           against the padding box.

           LADDER ONLY. In the ladder it answers "which of these ten is us", which is
           the first thing a viewer wants from a division column. A scoreboard has
           two sides and the footer has just named the XI, so there is nothing left to
           pick out — and the bar was competing with the gold score figures for the
           one accent the column is allowed. */
        .tile.ours { border-left: 0.6vh solid var(--gold); }

        /* Idle 'none' (no match): flatter base and a dimmed TLA so it recedes. */
        .tile.idle-none { background: rgba(255,255,255,0.03); }
        .tile.idle-none .tla { opacity: 0.4; }
        /* Silent-feed dot: left-of-centre, the same slot as the role icon — the two
           never co-occur (no innings role known when the feed is silent). */
        /* Silent-feed marker: a quiet, static muted dot — deliberately less present
           than the bat/bowl icons, since 'match on but no data' says less than a
           known innings role. Bottom-left, the role slot (the two never co-occur). */
        .dot { position: absolute; bottom: 1.5vh; left: 1.5vh; z-index: 1;
            width: 1.1vh; height: 1.1vh;
            border-radius: 50%; background: rgba(255,255,255,0.55); }

        /* Bat/bowl icon, tucked into the bottom-left corner clear of the centred TLA.
           PLACEHOLDER — swap for the club's own set. */
        .role { position: absolute; bottom: 0.6vh; left: 0.6vh; z-index: 1;
            width: 3vh; height: 3vh; color: #fff; }
        .role svg { width: 100%; height: 100%; display: block; }

        /* Ghost arrow, bottom-right: white, the pending move (shape carries direction,
           the numeral its size — places, not points). */
        .ghost { position: absolute; bottom: 0.7vh; right: 0.9vh; z-index: 1;
            font-size: 2.8vh; line-height: 1; color: #fff; opacity: 0.9; }
        .ghost i { font-style: normal; font-size: 1.9vh; font-weight: 900;
            margin-left: 0.15vh; vertical-align: 0.35vh; }

        /* Committed ladder moves ride this (FLIP, see playMoves). Long enough to
           read as a climb rather than a jump-cut; the fill keeps its own timing. */
        .tile[data-k] { transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1); }
        /* TIME HELD (the match-day simulator only — see live-clock.js). The view cycle
           is stopped in script; this stops what CSS is animating on its own, so a held
           screen is actually still rather than mid-FLIP. */
        html.clock-held *, html.clock-held *::before, html.clock-held *::after {
            animation-play-state: paused !important;
            transition: none !important;
        }
    </style>
</head>
<body>
    <div id="strip" class="strip"></div>
<!-- The chase model (resources, target, win probability), shared with the event
     extractor so the two never disagree about who is winning. -->
<script src="/assets/js/live-chase.js?v={{ asset_version }}"></script>
<!-- TVCL Win/Lose league points, shared with the match-day board so the ladder and
     the board's result badges can't price the same result differently. -->
<script src="/assets/js/tvcl-points.js?v={{ asset_version }}"></script>
<!-- FRESHNESS, on the match-day board's terms. Without this the ladder had no way
     to know how old a score was and so laddered a card the board had already
     withdrawn as too stale to show — the two surfaces giving different accounts of
     the same match, which is the thing every shared module here exists to stop. -->
<script src="/assets/js/live-status.js?v={{ asset_version }}"></script>
<!-- The event model: the per-type panel mapping and its fallback chains live in the
     type table, so the strip asks which panel an event wants rather than deciding
     for itself. Pure and DOM-free — nothing here starts a feed. -->
<script src="/assets/js/live-events.js?v={{ asset_version }}"></script>
<script>
(function () {
    var root = document.getElementById('strip');

    // Baked at build time: today's matches as VIEWS (one per match) — a division
    // ordered by league position plus the day's fixtures in it, or a two-tile
    // friendly. Context only: every live channel below is derived at runtime from
    // the player's feeds (`wcc-live` = our matches ball-by-ball, `wcc-league` =
    // everyone else's, coarse).
    var STRIP = {{ strip_json | safe }};
    var VIEWS = (STRIP && STRIP.views) || [];

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // PLACEHOLDER bat/bowl marks (swap for the club's icons): a bat blade + handle,
    // and a seamed ball.
    var GLYPH = {
        bat: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="12.5" y="2.5" width="5" height="13" rx="2.5" transform="rotate(38 15 9)"/><rect x="6.8" y="14.5" width="3" height="7" rx="1.5" transform="rotate(38 8.3 18)"/></svg>',
        bowl: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="currentColor"/><path d="M7.5 4.2 Q13 12 7.5 19.8" fill="none" stroke="#0a1c3a" stroke-width="1.6" stroke-linecap="round"/></svg>',
        // Provisional result (done, awaiting publication): a clock = "not yet official".
        prov: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5 V12 L15.5 14"/></svg>'
    };

    // Result lean → the full points colour (never washed out); certainty drives how
    // high the fill rises, not its colour.
    function leanColour(lean) { return lean === 'win' ? 'rgb(45,122,45)' : 'rgb(139,26,26)'; }

    /* THE SWINGOMETER, one span, two channels — the wall's one language for "who is
       winning", shared with the ladder tile it came from and the match-day board's
       `.sb-fill`:

         FILL COLOUR  = the lean, always the full outcome colour, never washed out
         FILL HEIGHT  = the certainty, a band rising from the bottom

       Extracted because it is now painted in two places (a ladder tile, and the
       scoreboard's "To win" figure) and those two must not drift apart. */
    function fill(lean, certainty) {
        var h = Math.round(Math.max(0, Math.min(1, certainty || 0)) * 100);
        return '<span class="fill" style="height:' + h + '%;background:' + leanColour(lean) + '"></span>';
    }

    /* A TEAM TILE, in one of two dialects.
       > James's direction, 2026-09-27.

       The LADDER (default) is unchanged: TLA, gold bar on our own tile, bat/bowl
       glyph for the live role. Ten rows in an 8vw column, where the job is position.

       The SCOREBOARD (`opt.badge`) names its two sides by CREST and drops both of
       the other identity channels:

       - **the gold bar**, because with two tiles and the footer naming the XI there
         is nothing left to pick out, and it was competing with the gold score figures
         for the column's one accent;
       - **the bat and ball glyphs**, because the LAYOUT now says who is batting —
         each side sits above its own figures, and the lower block is the one with
         numbers still moving. A glyph repeating that is the third telling of it.

       - **the certainty fill**, which does not disappear but MOVES: the scoreboard
         paints one swingometer, on its "To win" tile, exactly as the match-day board
         paints one on its "To win" aperture. See `scorePanel`.

       The provisional clock stays — "decided, not yet official" is a state nothing
       else on the surface reports. */
    function tile(t, opt) {
        opt = opt || {};
        /* The DIALECT, not "does this club have a badge". A crest-less side still gets
           the taller tile and the name lines, so the two sides of a scoreboard are the
           same shape whether or not both badges are cached — four of the twenty-five
           clubs in our divisions are not. */
        var badge = !!opt.badge;
        var cls = ['tile'];
        if (badge) cls.push('badge');
        // The panel decides this, not the tile — see badgeIsLong.
        if (badge && opt.long) cls.push('is-long');
        // The gold bar is a ladder channel; the scoreboard has no use for it.
        if (t.ours && !opt.badge) cls.push('ours');
        if (t.idle === 'none') cls.push('idle-none');
        if (t.idle === 'nodata') cls.push('idle-nodata');

        var inner = '';
        /* Certainty fill first (sits behind the content) — LADDER ONLY. Ten tiles
           each leaning is the ladder's whole point; two tiles leaning opposite ways
           is one fact told twice, in a column that is already carrying both sides'
           figures. The scoreboard paints it once instead, on "To win". */
        if (t.lean && !opt.badge) inner += fill(t.lean, t.certainty);
        // Bottom-left slot: bat/bowl while in play, else a clock while the result is
        // provisional (done, not yet published). The scoreboard keeps only the clock.
        if (t.role && GLYPH[t.role] && !opt.badge) inner += '<span class="role">' + GLYPH[t.role] + '</span>';
        else if (t.provisional) inner += '<span class="role">' + GLYPH.prov + '</span>';
        /* THE SCOREBOARD: crest, club, XI — the match-day tile's head, stacked. The
           badge is skipped when the club has none cached; the names stand on their own.
           THE LADDER: the abbreviation, which is all an 8vw ten-tile column can hold.
           A chase (object) is rendered separately by the panel below, never here. */
        if (badge) {
            if (t.crest) inner += '<img src="' + esc(t.crest) + '" alt="' + esc(t.tla) + '">';
            inner += '<span class="bclub">' + esc(clubLabel(t)) + '</span>';
            var xi = desigLabel(t);
            if (xi) inner += '<span class="bname">' + esc(xi) + '</span>';
        } else inner += '<span class="tla">' + esc(t.tla) + '</span>';
        // The arrow carries direction, the numeral how far — a one-place nudge and a
        // four-place surge are very different things, and the arrow alone hid that.
        // Bare arrow for a single place, so the common case stays quiet.
        if (t.ghost) inner += '<span class="ghost ' + t.ghost + '">' + (t.ghost === 'up' ? '▲' : '▼') +
            (t.ghostN > 1 ? '<i>' + t.ghostN + '</i>' : '') + '</span>';
        if (t.idle === 'nodata') inner += '<span class="dot"></span>';

        return '<div class="' + cls.join(' ') + '"' + (t.key ? ' data-k="' + esc(t.key) + '"' : '') +
               '>' + inner + '</div>';
    }

    /* The footer: which match the panel above is about. Its content mirrors the
       decomposition in live-events.js — our match names the XI over the division,
       and a match of someone else's would name the division alone, since which two
       clubs is answered by the panel's own tiles. Every view the strip holds today is
       one of OURS (the views are baked per Wendover match), so the second case only
       arrives when the strip starts taking its subject from the event stream. */
    /* WHAT A SCOREBOARD TILE IS LABELLED WITH: the club, and then the XI under it —
       `.sb-team` and `.sb-desig` from the match-day tile's head, which is where both
       lines and their treatment come from.

       THE CLUB FALLS BACK TO THE TLA, for a page old enough to be served a view with
       no `club` in it. THE XI IS ALLOWED TO BE ABSENT: some tables name their teams by
       club alone — the women's indoor softball division does — and an empty line under
       the crest says less than no line at all. Our own row does not reach that far,
       since the build fills its `desig` from the fixture's own team name.

       AND IT NEVER REPEATS THE CLUB. `_desig_of` splits "Denham CC - 2nd XI" into the
       two parts, but a feed that hands us the whole string in both fields would
       otherwise print it twice, one above the other. */
    /* THE SUFFIX COMES OFF: "Tring Park CC" → "Tring Park". `drop_cc` in build.py,
       in this column's terms, and for the same reason it gives — every name on this
       surface is a cricket club, so "CC" is repetition in a band that has none to
       spare, and the match-day board already writes them this way.

       DISPLAY ONLY. The view's `club` is the join key the live feeds name a batting
       side by ("is this tile's team batting?"), so it must stay exactly as the feed
       writes it; this trims the copy on its way to the tile and nothing else. */
    function dropCC(name) {
        var out = String(name == null ? '' : name).trim()
                    .replace(/\s+(CC|C\.C\.?|Cricket Club)$/i, '');
        return out || String(name == null ? '' : name).trim();
    }
    function clubLabel(t) { return dropCC(t.club || t.tla || ''); }
    function desigLabel(t) {
        var d = String(t.desig || '').trim().toLowerCase();
        if (!d) return '';
        var club = String(t.club || '').trim().toLowerCase();
        // Both spellings, since the club line has had its suffix trimmed: a feed
        // handing us "Denham CC" in both fields must not print it twice.
        return (d === club || d === dropCC(club)) ? '' : String(t.desig).trim();
    }

    /* Does a label need the step-down? Two bounds, because a band this narrow is
       constrained in two ways: the whole string over however many lines it may wrap
       to, and the longest single WORD, which cannot be broken at all. */
    function tooWide(label, maxChars, maxWord) {
        var longest = 0;
        String(label || '').split(/\s+/).forEach(function (w) {
            if (w.length > longest) longest = w.length;
        });
        return String(label || '').length > maxChars || longest > maxWord;
    }
    // The footer's bounds: one line at 1.7vh, clamped to two.
    function isLongLabel(label) { return tooWide(label, 9, 6); }
    /* The SCOREBOARD tile's bounds, and deliberately looser than the footer's — these
       are smaller faces with two lines each to wrap into, which measures out at about
       14 characters a line. Most clubs and most XIs sail inside them ("DENHAM CC",
       "1ST XI"); what does not is a long club ("Penn & Tylers Green CC") or a junior
       designation ("Under 15 Spitfires", "Under 10 - Hurricanes").

       DECIDED ONCE FOR THE WHOLE PANEL, from BOTH SIDES AND BOTH LINES. Per tile, an
       "Under 15 Spitfires" beside a "1st XI" would set the two sides of one scoreboard
       at two different type sizes, which reads as a mistake rather than as a fit. */
    function badgeIsLong(tiles) {
        return tiles.some(function (t) {
            return tooWide(clubLabel(t), 20, 10) || tooWide(desigLabel(t), 22, 11);
        });
    }
    /* THE COMPETITION, ALWAYS AS THE VIEW WRITES IT. `name_short` is the gold flag's
       own shortener — "TVCL Div 9E", league and division in the width this band
       actually has — and it is baked once per view, so every match in that view is
       entitled to it, ours or anyone else's. The event's own `division` is the raw
       league string ("Division 9E"), which has no league in it and does not fit the
       band; it was being used for other clubs' matches, so the same division was
       labelled two different ways depending on whose game was up.
       > James's observation, 2026-09-28. */
    function divisionOf(view, ev) {
        return view.name_short || view.name || (ev && ev.match && ev.match.division) || '';
    }
    function footer(view, ev, opt) {
        /* WHOSE MATCH, from the event when there is one. Ours names the XI over the
           division; somebody else's names the division alone, because which two
           clubs is answered by the panel's own marked tiles and two club names have
           never fitted 8vw — and the ticker has just said them anyway. */
        var ours = !ev || !ev.match || ev.match.ours;
        var team = ours ? (view.team_label || '') : divisionOf(view, ev);
        var div = ours ? divisionOf(view, ev) : '';
        /* THE SCOREBOARD DROPS THE XI and keeps the division: its team tiles name the
           club and the side already. Somebody else's match has no XI line to drop —
           the division is already all it was carrying — so the two cases land on the
           same string, which is the point of `divisionOf`. */
        if (opt && opt.divOnly) { div = div || team; team = ''; }
        if (!team && !div) return '';
        return '<div class="foot' + (team ? (isLongLabel(team) ? ' is-long' : '') : ' solo') + '">' +
               (team ? '<span class="foot-team">' + esc(team) + '</span>' : '') +
               '<span class="foot-div">' + esc(div) + '</span></div>';
    }

    /* One full-size figure tile (same footprint as a team tile): value over caption.
       `gold` marks the score itself — total and wickets — and `done` marks a figure
       that can no longer change (a closed innings, or any figure of a finished
       match). See the CSS for what each channel means. */
    function statTile(val, label, opt) {
        opt = opt || {};
        var cls = 'tile stat-tile' + (opt.gold ? ' gold' : '') + (opt.done ? ' done' : '') +
                  (opt.batting ? ' batting' : '');
        // `swing` is the scoreboard's one lean channel — see fill() and scorePanel().
        var sw = opt.swing;
        return '<div class="' + cls + '">' +
               (sw && sw.lean ? fill(sw.lean, sw.certainty) : '') +
               '<span class="cval">' + esc(val) + '</span>' +
               '<span class="clabel">' + esc(label) + '</span></div>';
    }
    /* A CLOSED INNINGS, in one tile: the score as a single gold figure with no label
       — see the CSS. Always `done`, since an innings written this way is one that
       cannot change. */
    function scoreTile(inn) {
        return '<div class="tile stat-tile line gold done">' +
               '<span class="cval">' + esc((inn.runs || 0) + '/' + (inn.wickets || 0)) +
               '</span></div>';
    }
    // A tile carrying a caption and no figure — "TO BAT" under the side still to come.
    function noteTile(label) {
        return '<div class="tile stat-tile note">' +
               '<span class="clabel">' + esc(label) + '</span></div>';
    }
    /* Runs per over as the column writes every rate: one decimal always, so a whole
       number doesn't jump the digits ("7" beside "6.8"). Null when no ball has been
       bowled — there is no rate yet, and a 0.0 would assert one. */
    function rateOf(runs, overs) {
        var b = ballsOf(overs);
        return b ? ((runs || 0) / (b / 6)).toFixed(1) : null;
    }
    /* Overs as the feed wrote them ("24.3" — the fraction is balls, not a decimal, so
       it is never reformatted), with the column's empty-state dot when absent. */
    function oversOf(inn) {
        var o = inn && inn.overs;
        return (o == null || o === '') ? '\u00b7' : String(o);
    }

    // The target the first innings set — shown once that innings is closed, sitting
    // directly under the side that set it. Null while they're still batting (there
    // is no target yet) and whenever the innings can't be read.
    function targetOf(card) {
        var inns = (card && card.innings) || [];
        if (!inns.length) return null;
        if (inns.length < 2 && !inns[0].closed) return null;
        return (inns[0].runs || 0) + 1;
    }

    /* THE CHASE BLOCK, at the foot of the second-innings scoreboard: what is needed,
       in how much, and at what rate. These OUTLIVE the match — once it's over the
       same numbers say how it finished, under a FINAL caption so they can't be
       misread as a chase still running. The required rate is the one live-only
       figure: there's nothing left to require it over.

       WICKETS LEFT IS NOT HERE ANY MORE. The chasing side's own `Wickets` tile sits
       three rows up, and a column carrying both "3 wickets" and "7 wkts left" makes
       the reader do the subtraction twice to check they agree. The scoreboard's
       figure wins, because it is the one a scoreboard states.

       THE SWINGOMETER RIDES THE FIRST OF THEM. `swing` is the chasing side's lean and
       certainty, and this is the one tile in the column about the OUTCOME rather than
       the score — which is exactly the match-day board's reasoning for putting its
       one fill on its own "To win" aperture. It is not mirrored and does not need to
       be: the figure belongs to the side chasing, so the fill under it is theirs.

       Returns {html, count} so the trailing spacer knows how many TILES went in (the
       caption is a fixed-height row, not a flex tile, so it doesn't count). */
    function chaseTiles(c, swing, batting) {
        var html = c.done ? '<div class="panel-cap">Final</div>' : '';
        var o = { done: c.done, batting: batting };
        // Live it is what they need; settled it is what was left when it ended, and
        // "to win" would be asking for something that can no longer happen.
        html += statTile(c.runs, c.done ? 'Runs left' : 'To win',
                         { done: c.done, batting: batting, swing: swing });
        var n = 1;
        if (c.balls != null) { html += statTile(c.balls, 'Balls left', o); n++; }
        if (!c.done && c.rr != null) {
            html += statTile(c.rr, c.rr_label || 'Run rate', { batting: batting }); n++;
        }
        return { html: html, count: n };
    }

    // ---- feed state ---------------------------------------------------------
    // Two independent feeds, two cadences (see live-engine.js): our matches arrive
    // rich and fast keyed by pc_id; the division's other matches arrive lean and
    // slow keyed by match_id. Both are just caches here — every render re-derives
    // from whatever is currently held, so a missing feed degrades to 'nodata'
    // tiles rather than a stale picture.
    var liveByPc = {}, leagueById = {};
    /* The last league ENVELOPE, kept because `live-status.js` ages a card against
       `generated_at` — the feed's own clock — and not against this browser's. That
       is what makes an age a subtraction of two numbers from one clock, and it is
       also the only version that survives the match-day simulator, whose cards are
       stamped on a simulated afternoon. */
    var lastLeague = null;

    // ---- side resolution ----------------------------------------------------
    // Everything here binds by ID, never by name. Both feeds identify sides
    // structurally — RV per innings/team with `is_home`, PC with `team_batting_id`
    // against `home_team_id` — and the baked fixture says which team id is at home,
    // so a tile resolves to 'home' or 'away' and the two meet there.
    //
    // This used to be a name join, and it was the wrong idea: a scorecard names a
    // side by TEAM ("Wendover CC Friendly XI"), our context by CLUB ("Wendover CC"),
    // with an arbitrary designation tail between them — and a club's own name can
    // itself end in "XI" ("Captain Scott Invitation XI Sunday 1st XI"), so no amount
    // of suffix-stripping is safe. A failed join was silent and looked like two
    // unrelated rendering bugs.

    // Which side of its fixture a tile's team is.
    function tileSide(team, fx) {
        if (!fx || !team.team_id || !fx.home_team_id) return null;
        return String(team.team_id) === String(fx.home_team_id) ? 'home' : 'away';
    }
    // Which side an innings belongs to. RV states it outright; PC gives the batting
    // team's id to compare against the card's home team.
    function inningsSide(card, inn) {
        if (typeof inn.is_home === 'boolean') return inn.is_home ? 'home' : 'away';
        if (inn.team_batting_id && card.home_team_id)
            return String(inn.team_batting_id) === String(card.home_team_id) ? 'home' : 'away';
        return null;
    }
    var other = function (side) { return side === 'home' ? 'away' : 'home'; };

    // Win/loss for one side of a completed match — again without reading prose.
    // Published results come from the feed's own verdict (RV states it per team, PC
    // as the winning team's id). Between "decided" and "published" neither exists
    // yet, so fall back to the scorecard: whoever has more runs is winning. A tie,
    // draw or abandonment leans neither way.
    function outcomeFor(card, side) {
        var t = (card.teams || []).filter(function (x) {
            return (x.is_home ? 'home' : 'away') === side; })[0];
        if (t && t.outcome) {
            return t.outcome === 'won' ? 'win' : t.outcome === 'lost' ? 'loss' : null;
        }
        if ('result_applied_to' in card) {   // PC card: null = nobody won
            if (!card.result_applied_to) return null;
            var winner = String(card.result_applied_to) === String(card.home_team_id) ? 'home' : 'away';
            return winner === side ? 'win' : 'loss';
        }
        var runs = {};
        (card.innings || []).forEach(function (inn) {
            var s = inningsSide(card, inn);
            if (s) runs[s] = (runs[s] || 0) + (inn.runs || 0);
        });
        if (runs.home == null || runs.away == null || runs.home === runs.away) return null;
        return (runs[side] > runs[other(side)]) ? 'win' : 'loss';
    }

    // ---- resources + win probability ---------------------------------------
    // The model itself lives in assets/js/live-chase.js, because the event
    // extractor (live-events.js) now prices `probability_shift`/`ladder_shift` off
    // the same numbers and the two surfaces must not disagree about who is winning.
    // Only the strip-specific mirroring stays here.
    //
    // Absent module → no lean and no certainty, which is exactly the first-innings
    // presentation: a role glyph and nothing claimed. A cache that serves this page
    // newer than its scripts degrades to that rather than throwing (see the
    // asset-cache-skew note).
    function ballsOf(overs) { return window.WccChase ? WccChase.ballsOf(overs) : 0; }
    function allotmentOvers(first) { return window.WccChase ? WccChase.allotmentOvers(first) : null; }
    function chaseState(inns) { return window.WccChase ? WccChase.chaseState(inns) : null; }

    // A match card + WHICH SIDE of it a tile is -> that tile's channels. The single
    // point where feed shapes become tile state; everything above it is model,
    // everything below it is paint. A side we can't resolve (a seeded match with no
    // team ids) reads as a silent feed rather than guessing.
    /* IS THIS MATCH ACTUALLY ON? — the board's `cls: 'play'`, which is what the
       silent dot is supposed to mean and what it had stopped meaning. A break counts:
       the game is under way, the players are just off the field. */
    function onNow(card) {
        return !!card && (card.phase === 'live' || card.phase === 'break' || !!card.break_desc);
    }

    /* THREE IDLE STATES, matching the three the match-day board draws (`WccStatus`
       classes 'play' / 'wait' / 'off'):

         'nodata'  THE DOT — the match is ON and we have no score for it. Either
                   nobody is scoring it ball by ball, or the score we had has been
                   withdrawn as stale. "Match on but no data", which is what the dot
                   has always said it meant.
         'quiet'   NO MARK, ordinary tile — a fixture today that has not started, or
                   one the feed has said nothing about. The board is deliberately
                   silent here too ("rather than asserting 'not started' about a game
                   we simply haven't heard from"), and a dot would be this tile
                   claiming a game is under way when it is not.
         'none'    DIMMED — no fixture at all today. Not playing, not waiting.

       The dot used to go on ALL of these but the last, so a side yet to start looked
       exactly like one in play with an unscored card — which is what made two of the
       division's four games indistinguishable from the other two. */
    function assess(card, side, ourSide, stale) {
        if (!card) return { idle: 'quiet' };
        /* NO FEED is the board's third class and the strip has no third mark for it,
           so it lands on 'quiet' — the honest half of the choice, since the alternative
           was to keep asserting a game was in play when the truth is we could not
           reach it. It does mean a fetch failure now looks like a game not yet
           started; see the note in the commit. */
        if (card.phase === 'no-feed') return { idle: 'quiet' };
        if (!side) return { idle: 'quiet' };
        var inns = card.innings || [];
        if (card.complete) {
            var lean = outcomeFor(card, side);
            // `final` is the scorer's confirmation (our rich feed only). Decided but
            // unconfirmed shows the clock instead of a role glyph.
            var prov = card.final === false;
            return { lean: lean, certainty: lean ? 1 : 0, provisional: prov };
        }
        /* THE TOSS PUTS THE GLYPHS UP BEFORE A BALL IS BOWLED. Until it did, the role
           came only from the last innings in the card, so between the toss and the
           first ball both tiles sat blank — `idle: 'nodata'`, the same state as a
           feed saying nothing at all — while the feed in fact knew exactly who was
           about to bat. A role and no lean is already the first-innings presentation
           (`certainty = 0` below), so this is that same state, half an hour earlier.

           `phase: 'pre'` no longer short-circuits above for the same reason: a
           pre-match card with the toss in it has something to say. One without still
           lands on `nodata`, through the innings check here. */
        if (!inns.length) {
            var firstBat = window.WccChase ? WccChase.battingFirst(card, ourSide) : null;
            // No toss either: the dot only if the game is actually under way — a
            // scoreless card for a match nobody is scoring. Before the start, quiet.
            if (!firstBat) return { idle: onNow(card) ? 'nodata' : 'quiet' };
            return { role: firstBat === side ? 'bat' : 'bowl', certainty: 0 };
        }
        /* A SCORE THE BOARD HAS WITHDRAWN MUST NOT BE LADDERED. `stale` is the
           match-day board's own judgement, computed by the caller from the same
           `live-status.js` bands the squares use — so the two surfaces cannot give
           different accounts of the same match.

           The board strikes three things on a stale square: the batting-half marker,
           the chase pricing (`setSwing(null)`) and the score itself, which the status
           token replaces. Those are exactly this tile's role glyph, its lean and
           certainty, and its TLA-with-a-dot — so withdrawing to the silent-feed state
           is the same decision made in the strip's own vocabulary. It also settles
           the ladder for free: with no `p` on the row, `expectedPoints` falls back to
           neutral, so no ghost arrow and no projected reorder rides a score we have
           just said we do not trust. */
        if (stale) return { idle: 'nodata' };
        var cur = inns[inns.length - 1];
        var batting = inningsSide(card, cur) === side;
        var out = { role: batting ? 'bat' : 'bowl' };
        var chase = chaseState(inns);
        if (chase) {
            // p is the chasing side's; mirror it for the side defending.
            var p = batting ? chase.p : 1 - chase.p;
            out.lean = p >= 0.5 ? 'win' : 'loss';
            out.certainty = Math.min(0.95, Math.abs(2 * p - 1));
            out.p = p;
        } else {
            out.certainty = 0;   // first innings — a role, no lean
        }
        return out;
    }

    // The chase panel's numbers, live or final. Deliberately NOT part of a tile's
    // state: the panel describes the match, not the side, and it has to outlive the
    // innings that produced it.
    function chaseStats(card) {
        var st = chaseState((card && card.innings) || []);
        if (!st) return null;
        return { runs: st.runs, balls: st.balls, wkts: st.wkts, rr: st.rr,
                 rr_label: st.rr_label, done: !!(card && card.complete) };
    }

    // ---- tile binding -------------------------------------------------------
    function cardFor(view, fx) {
        if (!fx) return null;
        return fx.ours ? liveByPc[String(fx.match_id)] : leagueById[String(fx.match_id)];
    }

    /* IS THIS CARD'S SCORE TOO OLD TO LADDER? — the match-day board's rule, reached
       the same way it reaches it (`paintSquare`).

       ONLY SOMEBODY ELSE'S MATCHES. The board treats the two feeds differently and
       deliberately: a division square withdraws its score at the stale band, while
       one of OUR tiles keeps its score and reports the age beside it ("↻ 30m"),
       because our feed carries the scorer's own cursor and far more to be wrong
       about. Withdrawing ours here would be the ladder overruling the board, which is
       the opposite of the point.

       A CLOSED INNINGS IS EXEMPT FROM ALL OF IT — `WccStatus.closed` — so a first
       innings total during the chase, and every innings of a decided match, keep
       their figures however long they have stood. Nothing can change them, so there
       is nothing to be stale about.

       `observe` is how the watch is kept: it records the figures it saw against the
       feed's own clock and returns how long they have stood. Calling it once per
       render matches what the board does, and it is idempotent while the figures
       hold still. */
    function staleCard(fx, card) {
        var S = window.WccStatus;
        if (!S || !fx || fx.ours || !card || card.complete) return false;
        var inns = card.innings || [];
        var cur = inns.length ? inns[inns.length - 1] : null;
        var age = S.observe('l' + fx.match_id, card, lastLeague);
        if (!cur || S.closed(card, cur)) return false;
        return S.band(age) === 'stale';
    }
    function fixtureForTeam(view, teamId) {
        var fxs = view.fixtures || [];
        for (var i = 0; i < fxs.length; i++) {
            if ((fxs[i].team_ids || []).indexOf(teamId) !== -1) return fxs[i];
        }
        return null;
    }

    // ---- league points ------------------------------------------------------
    // TVCL Win/Lose (Match Rules §9), in tvcl-points.js because the match-day
    // board badges finished games with the same figures. Absent script (a page
    // newer than its cached assets) prices nothing, which the ladder already
    // treats as "not final" and so holds position for.
    function tvclPoints(inns, resultText) {
        return window.WccPoints ? WccPoints.tvcl(inns, resultText) : null;
    }

    // What one side actually earned, once its match is decided. Prefers the
    // server-computed figure on our own rich card; falls back to the port above for
    // the division's other matches. Null when it can't be priced — which the ladder
    // treats as "not final", so it holds position rather than guessing.
    function settledPoints(view, card, side) {
        if (!view.tvcl || !card || !card.complete) return null;
        var inns = card.innings || [];
        if (inns.length < 2) return null;
        var idx = -1;
        for (var i = 0; i < inns.length; i++) if (inningsSide(card, inns[i]) === side) { idx = i; break; }
        if (idx < 0) return null;
        if (inns[idx].points != null) return inns[idx].points;
        var pts = tvclPoints(inns, card.result);
        return pts ? pts[idx] : null;
    }

    // A LOSS IS NOT ZERO. TVCL gives the beaten side batting + bowling bonus points
    // — a team bowled out for 150 that took 6 wickets still banks 8. So the value of
    // an unfinished match is a blend, and even a near-certain loss is worth
    // something. This average stands in for the loser's bonus while a match is
    // still running; once it's decided, settledPoints() replaces it with the real
    // figure. Deliberately a single documented constant, not a model.
    var LOSS_BONUS = 7;
    function expectedPoints(p, winPoints) {
        return p * winPoints + (1 - p) * LOSS_BONUS;
    }

    // ---- the ladder ---------------------------------------------------------
    // Three orders, doing three different jobs:
    //   DISPLAY   — where tiles actually sit. League order, with a swap applied only
    //               when BOTH teams involved are final (settled, or not playing at
    //               all). An unfinished match is a barrier: nothing may jump a team
    //               whose result is still unknown, so the ladder moves once, when
    //               it's earned, instead of twice.
    //   BASELINE  — every unfinished match priced at its neutral expectation.
    //   PROJECTED — the same, but priced at what's ACTUALLY happening out there.
    // The ghost is BASELINE → PROJECTED, so it means "how today is going versus what
    // was expected of it" — not "who has a fixture". At the first ball the two
    // orders are identical and the strip is arrow-free; arrows appear only as
    // matches diverge, and grow as certainty does.
    function ladder(view, rows) {
        var wp = view.win_points;
        // No points system, or a table that may already count today, and the whole
        // overlay is unsafe — show the league's own order and no arrows.
        if (!wp || view.table_counts_today) return rows;

        var neutral = expectedPoints(0.5, wp);
        rows.forEach(function (r) {
            var known = r.points != null;
            r.ptsNow = known ? r.points + (r.settledPts || 0) : null;
            r.final = r.idle === 'none' || r.settledPts != null;
            var pending = known && !r.final && r.idle !== 'none';
            r.base = known ? r.ptsNow + (pending ? neutral : 0) : null;
            // p is only known once a chase is on; before that a match sits at its
            // neutral value, which is exactly why nothing moves in a first innings.
            r.proj = known ? r.ptsNow + (pending ? expectedPoints(r.p != null ? r.p : 0.5, wp) : 0) : null;
        });
        if (rows.some(function (r) { return r.ptsNow == null; })) return rows;

        // DISPLAY: adjacent swaps only, and only between two final teams.
        var out = rows.slice(), swapped = true, guard = 0;
        while (swapped && guard++ < 50) {
            swapped = false;
            for (var i = 0; i + 1 < out.length; i++) {
                var a = out[i], b = out[i + 1];
                if (a.final && b.final && b.ptsNow > a.ptsNow) {
                    out[i] = b; out[i + 1] = a; swapped = true;
                }
            }
        }

        // GHOST: rank under BASELINE vs under PROJECTED. Shown only for matches
        // still in play — a settled team has nothing pending, and its tile has
        // already moved.
        var byBase = rows.slice().sort(function (x, y) { return y.base - x.base || rows.indexOf(x) - rows.indexOf(y); });
        var byProj = rows.slice().sort(function (x, y) { return y.proj - x.proj || rows.indexOf(x) - rows.indexOf(y); });
        rows.forEach(function (r) {
            if (r.final || r.idle) return;
            var move = byBase.indexOf(r) - byProj.indexOf(r);
            if (move > 0) { r.ghost = 'up'; r.ghostN = move; }
            else if (move < 0) { r.ghost = 'down'; r.ghostN = -move; }
        });
        return out;
    }

    function leagueTiles(view) {
        var rows = (view.teams || []).map(function (team) {
            var fx = fixtureForTeam(view, team.team_id);
            var card = fx ? cardFor(view, fx) : null;
            var side = fx ? tileSide(team, fx) : null;
            /* Which side of THIS tile's fixture is Wendover, for the toss to be read
               against — `battingFirst` needs it to put "we bat" on the home/away axis
               the tiles bind to. Only our own fixture has a toss in the feed at all
               (the league feed carries none), and there we are one of the two sides,
               so the tile's own `ours` flag answers it without a lookup. */
            var ourSide = (fx && fx.ours && side) ? (team.ours ? side : other(side)) : null;
            var state = fx ? assess(card, side, ourSide, staleCard(fx, card)) : { idle: 'none' };
            var t = { key: team.team_id, tla: team.tla, ours: team.ours, points: team.points,
                      settledPts: fx ? settledPoints(view, card, side) : null };
            for (var k in state) if (state.hasOwnProperty(k)) t[k] = state[k];
            return t;
        });
        return ladder(view, rows);
    }

    /* THE TWO SIDES OF ONE MATCH, batting side on top — the `score` panel. Works for
       ANY fixture in the view, ours or the division's, because an event about
       somebody else's match wants their score in the band, not ours.

       It was `friendlyTiles` and read only `view.pc_id`, which was fine while the
       panel was a property of the FIXTURE (a friendly has no ladder, so it got this).
       Now it is a property of the EVENT, so the same two tiles have to be drawable
       for any of the ten sides in a division view.

       The two team rows come from the fixture's `team_ids`; a two-team view whose
       opposition has no id (a friendly the build could not resolve) falls back to the
       view's own pair, which is what used to resolve it — "whichever side we aren't". */
    function matchTiles(view, fx) {
        if (!fx) return [];
        var card = cardFor(view, fx);
        var all = view.teams || [];
        var teams = (fx.team_ids || []).map(function (id) {
            return all.filter(function (t) { return String(t.team_id) === String(id); })[0] || null;
        }).filter(Boolean);
        if (teams.length < 2 && all.length === 2) teams = all.slice();
        if (teams.length < 2) return [];

        var sides = teams.map(function (t) { return tileSide(t, fx); });
        // A view of two where an id wouldn't resolve: our own side places both.
        if (!sides[0] || !sides[1]) {
            var oursAt = teams[0].ours ? 0 : 1;
            var os = tileSide(teams[oursAt], fx);
            if (!os) return [];
            sides[oursAt] = os; sides[1 - oursAt] = other(os);
        }
        var oursIdx = teams[0].ours ? 0 : (teams[1].ours ? 1 : -1);
        var ourSide = oursIdx >= 0 ? sides[oursIdx] : null;
        /* The side batting first goes on top — from the TOSS as well as from
           innings[0], so the two tiles change places the moment the toss lands rather
           than waiting for the first ball. `battingFirst` prefers the innings when
           there is one, and answers null for a division match (no toss in that feed),
           leaving the baked order. */
        var firstSide = window.WccChase ? WccChase.battingFirst(card, ourSide) : null;
        if (firstSide && sides[0] && firstSide !== sides[0]) { teams.reverse(); sides.reverse(); }
        var stale = staleCard(fx, card);
        return teams.map(function (team, i) {
            var state = assess(card, sides[i], ourSide, stale);
            var t = { tla: team.tla, crest: team.crest, club: team.club,
                      desig: team.desig, ours: team.ours };
            for (var k in state) if (state.hasOwnProperty(k)) t[k] = state[k];
            return t;
        });
    }

    /* ---- what the strip is showing -----------------------------------------
       THE SCHEDULER PICKS, NOT THIS SURFACE. Under v1 the strip chose its own
       subject — the ticker's `wcc-featured` relay when it spoke, and otherwise a
       twenty-second cycle of its own — and chose its panel from the baked view's
       mode, fixed for the day. Both are v2's business now: the subject is the showing
       event's match and the panel is what that event's TYPE asks for, so the three
       parts of the L describe one thing instead of three.

       The relay and the cycle are gone with it. A surface with its own timer beside
       an event-driven one drifts off it within a minute. */
    var showing = null;      // the scheduler's current pick
    var haveEvents = false;  // has an event stream ever spoken to us?

    // Which baked view holds this event's match: ours by pc_id, the division's by
    // finding the view whose fixture list contains it.
    function viewForEvent(ev) {
        var m = ev && ev.match; if (!m) return null;
        var i;
        if (m.pc_id != null) {
            for (i = 0; i < VIEWS.length; i++)
                if (String(VIEWS[i].pc_id) === String(m.pc_id)) return VIEWS[i];
        }
        if (m.match_id != null) {
            for (i = 0; i < VIEWS.length; i++)
                if ((VIEWS[i].fixtures || []).some(function (fx) {
                    return String(fx.match_id) === String(m.match_id); })) return VIEWS[i];
        }
        return null;
    }
    function fixtureForEvent(view, ev) {
        var m = ev && ev.match; if (!view || !m) return null;
        var id = m.pc_id != null ? m.pc_id : m.match_id;
        return (view.fixtures || []).filter(function (fx) {
            return String(fx.match_id) === String(id); })[0] || null;
    }
    /* WHAT THIS SURFACE CAN ACTUALLY DRAW, which is the half of the panel decision
       only the strip knows. `panelFor` walks the type's fallback chain against it, so
       a type asking for something unavailable lands on the next best thing rather
       than on an empty band. `form` and `profile` are both unbuilt, so they always
       fall through today — by design, not by omission. */
    function availFor(view, fx) {
        var card = fx ? cardFor(view, fx) : null;
        return {
            ladder: !!(view && view.mode === 'league' && (view.teams || []).length),
            score: !!(card && ((card.innings || []).length || card.complete)),
            form: false,
            profile: false
        };
    }
    function panelFor(ev, view, fx) {
        if (!window.WccLiveEvents) return view && view.mode === 'league' ? 'ladder' : 'score';
        return WccLiveEvents.panelFor(ev.type, availFor(view, fx)).panel;
    }

    // ---- render -------------------------------------------------------------
    // FLIP for committed ladder moves: measure where each tile is, let the render
    // put it somewhere else, then start it back at the old position and let CSS
    // carry it. Without this a promotion is a jump-cut and the eye misses it —
    // the movement IS the information. Keyed by team id, so it survives the
    // wholesale innerHTML rewrite. No-ops in any environment without layout.
    var raf = window.requestAnimationFrame || function (f) { f(); };
    function tilePositions() {
        var out = {};
        if (!root.querySelectorAll) return out;
        Array.prototype.forEach.call(root.querySelectorAll('[data-k]'), function (el) {
            if (el.getBoundingClientRect) out[el.getAttribute('data-k')] = el.getBoundingClientRect().top;
        });
        return out;
    }
    function playMoves(before) {
        if (!root.querySelectorAll) return;
        Array.prototype.forEach.call(root.querySelectorAll('[data-k]'), function (el) {
            if (!el.getBoundingClientRect || !el.style) return;
            var was = before[el.getAttribute('data-k')];
            if (was == null) return;
            var delta = was - el.getBoundingClientRect().top;
            if (Math.abs(delta) < 1) return;
            el.style.transition = 'none';
            el.style.transform = 'translateY(' + delta + 'px)';
            raf(function () { el.style.transition = ''; el.style.transform = ''; });
        });
    }

    var lastKey = '';

    /* THE SCORE PANEL — THE SCOREBOARD, STOOD ON ITS END.
       > James's direction, 2026-09-27.

       The ticker is moving away from being a second scoreboard and towards a plain
       headline, so the figures come here instead: whenever the strip is not showing
       the ladder, the band is the match's numbers and its state, read top to bottom.

       An INNINGS is the unit, and it is always written the same way — the side, then
       its figures under it:

         1st innings              2nd innings
         ---------------          ---------------
         bat   TLA                bowl  TLA        the side that batted first,
         gold  Runs               gold  253/6      now closed: ONE figure, no
         gold  Wickets                             labels, the way the board
               Overs              bat   TLA        writes a settled innings
               Run rate           gold  Runs
         bowl  TLA                gold  Wickets    the side chasing
               TO BAT                   Overs
                                        To win     the chase block
                                        Balls left
                                        Req rate

       The first innings is seven tiles and the second nine, and the spacer takes
       whatever is left of the ladder's ten shares so the tiles keep the ladder's
       height rather than growing to fit.

       The batting side is the one with figures moving, and it is always the LOWER of
       the two blocks — which is where the eye already is, coming out of the corner.
       That falls out of `matchTiles` putting the side that batted first on top, and
       is why the same ordering reads correctly in both innings.

       WHY NO TARGET TILE. It was the panel's one figure under v1 and it is gone: the
       chase block's "To win" is the same fact live (target minus what they have), and
       between the innings the To-bat slot below shows the target outright. A standing
       `Target` tile beside a falling `To win` was two numbers for one question. */
    function scorePanel(view, fx) {
        var tiles = matchTiles(view, fx);
        if (!tiles.length) return '';
        /* The scoreboard's tile dialect (see tile()), carrying the one decision that
           belongs to the panel rather than the tile: whether the names step down. */
        var BADGE = { badge: true, long: badgeIsLong(tiles) };
        var card = cardFor(view, fx);
        var inns = (card && card.innings) || [];
        var done = !!(card && card.complete);
        /* TWO BLOCKS, ONE PER SIDE, built separately because only one of them goes in
           the scorebox — see the assembly at the end. A block is a side's crest tile
           followed by whatever figures belong to it, and each carries its own share
           count so the housing and the spacer can be sized from them. */
        /* TWO COUNTS PER BLOCK, because a block now holds two kinds of tile.
           `flex` is what it actually asks the column for — the FIGURE tiles it holds,
           which are the only ones that stretch. `used` is the whole block in ladder
           tiles, the heading and the closed-innings line included at their estimates,
           and is what the spacer is worked out from.
           A block with no figures in it at all (the bowling side during a chase: a
           name and a closed score, both content-sized) asks for nothing and takes
           exactly its content — otherwise it would hold a share it cannot fill and
           leave a band of dead column above the innings being played. */
        function block() { return { html: '', used: 0, flex: 0 }; }
        function put(g, html, n) {
            g.html += html; n = (n == null ? 1 : n); g.used += n; g.flex += n;
        }
        // A tile that is sized by its own content: counted for the spacer, never asked
        // for as a share.
        function putFixed(g, html, n) { g.html += html; g.used += n; }
        /* WHAT A HEADING TILE COSTS, for the spacer's arithmetic only — it no longer
           takes a flex share at all (see `.tile.badge`), but the spacer still has to
           know roughly how much of the column it eats or a short panel would reserve
           too much slack and leave its apertures short.

           DELIBERATELY AN APPROXIMATION, and rounded UP rather than down: an
           over-estimate hands the spacer fewer shares than it strictly needs, so a
