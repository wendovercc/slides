<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Deck builder — Wendover CC</title>
  <style>
    @font-face { font-family: 'Lato'; font-weight: 400; font-display: swap; src: url('/assets/fonts/lato-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 700; font-display: swap; src: url('/assets/fonts/lato-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lato'; font-weight: 900; font-display: swap; src: url('/assets/fonts/lato-latin-900-normal.woff2') format('woff2'); }
    :root {
      --navy-1: #0f2346; --navy-2: #0a1c3a; --gold: #d4af37; --ink-soft: #b4c8e4;
      --panel: #12294f; --line: rgba(180,200,228,.18); --white: #fff;
      --warn: #f2c96b; --bad: #f0a0a0;
      /* The three fixed right-hand deck-row columns — see "rows" below. */
      --meta-w: 88px; --dur-w: 46px; --btns-w: 72px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Lato', -apple-system, Arial, sans-serif; color: var(--white);
      background: linear-gradient(165deg, var(--navy-1) 0%, var(--navy-2) 100%);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 9px 18px; border-bottom: 2px solid var(--gold);
      display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; flex-shrink: 0;
      background: var(--navy-2); z-index: 20;
    }
    header h1 { font-size: 17px; font-weight: 900; margin: 0; letter-spacing: .01em; white-space: nowrap; }
    header h1 span { color: var(--gold); }
    .spacer { flex: 1; }
    /* Error channel, not a save indicator: the deck is written synchronously on
       every mutation, so "Saved" would be permanently true and therefore silent. */
    .save-status { color: var(--bad); font-size: 12px; white-space: nowrap; }
    .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .btn-row { display: flex; align-items: center; gap: 10px; }
    .btn { font: inherit; font-weight: 700; padding: 7px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--gold); background: var(--gold); color: var(--navy-2); }
    .btn.ghost { background: transparent; color: var(--gold); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.sm { padding: 6px 11px; font-size: 13px; }
    select, input[type=text] {
      font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--panel); color: var(--white);
    }
    #draft-picker { max-width: 30ch; font-weight: 700; }

    /* ---- deck menu (rename / duplicate / delete / import) ------------------ */
    .menu { position: relative; }
    .menu > summary {
      list-style: none; cursor: pointer; user-select: none;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
      border-radius: 6px; padding: 7px 11px; line-height: 1; font-weight: 700;
    }
    .menu > summary::-webkit-details-marker { display: none; }
    .menu[open] > summary { color: var(--white); border-color: var(--gold); }
    .menu-items {
      position: absolute; top: calc(100% + 6px); left: 0; min-width: 20ch; z-index: 30;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 5px; display: flex; flex-direction: column;
    }
    .menu-items button {
      font: inherit; font-size: 13.5px; text-align: left; padding: 7px 10px; border: 0;
      background: transparent; color: var(--white); cursor: pointer; border-radius: 5px;
      white-space: nowrap;
    }
    .menu-items button:hover { background: rgba(212,175,55,.18); }
    .menu-items .danger { color: var(--bad); }
    .menu-items hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

    /* ---- layout: deck + discover left, a wide preview right ---------------- */
    main { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 0;
      align-items: stretch; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #left { border-right: 1px solid var(--line); display: flex; flex-direction: column;
      min-height: 0; overflow: hidden; }
    /* Deck on top, discover below — stacked rather than tabbed so the insertion
       caret stays visible while you are choosing what to put in it. */
    #deck-pane { flex: 2 1 0; display: flex; flex-direction: column; min-height: 0; }
    #find-pane { flex: 3 1 0; display: flex; flex-direction: column; min-height: 0;
      border-top: 1px solid var(--line); background: rgba(10,28,58,.35); }
    #deck-list, #results { overflow-y: auto; flex: 1 1 auto; }
    #deck-list { padding-bottom: 24px; }
    .pane-head {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: 0 0 auto;
      border-bottom: 1px solid var(--line); background: var(--navy-2);
    }
    .pane-head .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--gold); white-space: nowrap; }
    .pane-head .count { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .pane-head .spacer { flex: 1; }
    /* Both pane actions open a new tab and both disappear when they'd do nothing. */
    .pane-head .btn.sm, .prev-head .btn.sm { padding: 4px 9px; font-size: 12px; }
    #find-search { flex: 1 1 auto; min-width: 6ch; font-size: 13px; padding: 5px 9px; }
    .empty-hint { color: var(--ink-soft); font-size: 13.5px; padding: 20px 16px; line-height: 1.5; }

    /* ---- segmented control (kind filter, ctx toggle) ---------------------- */
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: 0 0 auto; }
    .seg button { font: inherit; font-size: 11.5px; font-weight: 700; padding: 5px 9px; border: 0;
      background: transparent; color: var(--ink-soft); cursor: pointer; }
    .seg button.on { background: var(--gold); color: var(--navy-2); }

    /* ---- rows ------------------------------------------------------------- */
    /* A group row: a match package or a multi-panel slide, which are the same
       creature to an editor. `.twist` is the expander; it is an empty cell on a
       group with nothing under it, so every row keeps the same column grid.

       The three right-hand columns are FIXED and shared with the child rows, so they
       line up down the whole list. The leading columns differ — a stripe and a grip
       against an indent rule — but `1fr` on the title absorbs that, which anchors
       meta/duration/buttons to the same right edge on both. They used to be `auto`,
       which lines up only while the text either side happens to be the same width:
       a group's `9 steps` against a child's blank meta pushed the durations apart. */
    .row {
      display: grid;
      grid-template-columns: 5px 13px 11px 1fr var(--meta-w) var(--dur-w) var(--btns-w);
      align-items: center; gap: 8px; padding: 7px 10px 7px 0;
      border-bottom: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
    }
    .row .twist { color: var(--ink-soft); font-size: 9px; line-height: 1; text-align: center;
      user-select: none; }
    .row.has-kids:hover .twist { color: var(--gold); }
    /* Child rows: one step of the group. Indented under the group's stripe, and
       measured on the same columns from the title across, so the numbers line up. */
    .crow {
      display: grid;
      grid-template-columns: 29px 1fr var(--meta-w) var(--dur-w) var(--btns-w);
      align-items: center; gap: 8px; padding: 5px 10px 5px 0;
      border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer;
      background: rgba(0,0,0,.16);
    }
    .crow:hover { background: rgba(180,200,228,.06); }
    .crow.pv { background: rgba(212,175,55,.14); }
    .crow .kid-rule { justify-self: end; width: 9px; height: 9px;
      border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
      border-bottom-left-radius: 3px; margin-bottom: 4px; }
    .crow .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0; font-weight: 500; }
    .crow .meta.curating { color: var(--gold); }
    /* A step switched off is still listed — the UI is subtractive, so putting it
       back has to be as easy as taking it out. */
    .crow.off .ttl { color: var(--ink-soft); text-decoration: line-through; }
    .crow.off .meta { font-style: italic; }
    /* The numeric columns read as one, whichever row they are on: same size, same
       right edge. Meta is right-aligned so it pairs with the duration beside it
       (`9 steps  7:40`) instead of drifting away from it under a long title. */
    .row .meta, .crow .meta { font-size: 11.5px; text-align: right; overflow: hidden;
      text-overflow: ellipsis; }
    .row .dur, .crow .dur { width: 100%; font: inherit; font-size: 11.5px; padding: 2px 4px;
      border-radius: 4px; border: 1px solid var(--line); background: var(--panel);
      color: var(--white); font-variant-numeric: tabular-nums; text-align: right; }
    .row .dur:disabled, .crow .dur:disabled { opacity: .4; border-color: transparent;
      background: transparent; }
    /* The duration column, read-only: a group's total is the sum of its steps and a
       reel's comes from the clip trims, so both are shown rather than typed. Same
       width and right edge as the box — the point of the one column is that every
       duration in the deck lines up, collapsed or expanded. */
    .dur-static { width: 100%; color: var(--ink-soft); font-size: 11.5px;
      font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .dur-static.curating { color: var(--gold); }
    /* One button on a child row against three on a group row, so the child's ✕ is
       pushed to the right to sit under the group's. */
    .row .rowbtns, .crow .rowbtns { display: flex; gap: 1px; justify-content: flex-end; }
    .row:hover { background: rgba(180,200,228,.06); }
    .row.pv { background: rgba(212,175,55,.14); }
    .row.dragging { opacity: .4; }
    /* Set stripe: a contiguous run of one set reads as a block, so a split is
       visible before the deck check explains it. Colour is per set (set by JS). */
    .row .stripe { width: 5px; align-self: stretch; }
    .row .grip { color: var(--ink-soft); cursor: grab; font-size: 12px; line-height: 1; user-select: none; }
    .kind { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      padding: 2px 4px; border-radius: 4px; background: rgba(180,200,228,.16); color: var(--ink-soft);
      text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kind.k-set { background: rgba(212,175,55,.22); color: var(--gold); }
    .kind.k-deck { background: rgba(120,80,160,.5); color: #e5d4f2; }
    /* The slug is deliberately not on the row — the preview header names it, and one
       line per row is what keeps a 30-slide deck scannable. */
    .row .ttl, .res .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 700; }
    /* Live is a warning, not a category: it cannot be narrated or rendered. */
    .ttl.is-live::before { content: '● '; color: #7cd07c; }
    .row .meta, .crow .meta, .res .meta { color: var(--ink-soft); font-size: 11.5px;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* Live from the editor's curation rather than from the build. */
    .row .meta.curating { color: var(--gold); }
    .iconbtn { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
      font-size: 13px; line-height: 1; padding: 3px 5px; border-radius: 4px; }
    .iconbtn:hover { color: var(--white); background: rgba(180,200,228,.14); }
    .iconbtn.del:hover { color: var(--bad); }
    .row.warn-row .ttl { color: var(--warn); }

    /* Discover results: click previews, the + adds. */
    .res { display: grid; grid-template-columns: 42px 1fr auto 28px; align-items: center;
      gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line);
      font-size: 13.5px; cursor: pointer; }
    .res:hover { background: rgba(180,200,228,.07); }
    .res.pv { background: rgba(212,175,55,.14); }
    .res.in-deck .ttl { color: var(--ink-soft); }
    /* Partly in the deck: steps have been taken out, and `+` is what puts them
       back. Distinguished from "whole" so the live button reads as an action. */
    .res.part .meta { color: var(--gold); }
    .res .add:disabled { opacity: .3; cursor: default; }
    .res .add:disabled:hover { background: transparent; color: var(--gold); }
    .res .add { border: 1px solid var(--line); background: transparent; color: var(--gold);
      cursor: pointer; border-radius: 5px; font: inherit; font-weight: 700; font-size: 14px;
      line-height: 1; padding: 3px 0; width: 26px; }
    .res .add:hover { background: var(--gold); color: var(--navy-2); }
    .res-group { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;
      letter-spacing: .05em; padding: 9px 10px 4px; position: sticky; top: 0;
      background: #0c2044; z-index: 1; }

    /* ---- the insertion caret --------------------------------------------- */
    .caret { height: 9px; position: relative; cursor: pointer; }
    .caret::after {
      content: ''; position: absolute; left: 8px; right: 8px; top: 3px; height: 2px;
      background: rgba(180,200,228,.14); border-radius: 2px;
    }
    .caret:hover::after { background: rgba(212,175,55,.5); }
    .caret.active::after { background: var(--gold); box-shadow: 0 0 6px rgba(212,175,55,.7); }
    .caret.drop::after { background: var(--gold); }

    /* ---- right column ----------------------------------------------------- */
    aside { padding: 12px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .prev-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex: 0 0 auto; }
    .prev-head .t { font-size: 13px; color: var(--white); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .prev-head .t i { font-style: normal; color: var(--ink-soft); }
    .preview-wrap { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 8px;
      overflow: hidden; flex: 0 0 auto; border: 1px solid var(--line); }
    .preview-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .preview-none { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: var(--ink-soft); font-size: 13px; text-align: center; padding: 0 20px; }
    /* `display:flex` above outranks the UA's `[hidden]{display:none}`, so the
       placeholder needs its own hide rule or it sits over the preview forever. */
    .preview-none[hidden] { display: none; }

    .check-head { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; flex: 0 0 auto; }
    .check-head .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--gold); }
    .check-head .ok { font-size: 12.5px; color: var(--ink-soft); }
    #warnings { flex: 1 1 auto; overflow-y: auto; min-height: 0;
      border-top: 1px solid var(--line); padding-top: 8px; }
    .warn-line { font-size: 12.5px; line-height: 1.45; color: var(--warn); padding: 3px 0; }
    .warn-line.bad { color: var(--bad); }
    .warn-line b { color: inherit; }

    @media (max-width: 1180px) {
      body { height: auto; display: block; overflow: auto; }
      main { grid-template-columns: 1fr; overflow: visible; }
      #left, aside, #deck-list, #results, #warnings { height: auto; overflow: visible; }
      #deck-pane, #find-pane { display: block; }
      aside { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Wendover<span>CC</span> · Deck builder</h1>
    <select id="draft-picker" aria-label="Draft deck"></select>
    <details class="menu" id="deck-menu">
      <summary title="Deck actions">⋯</summary>
      <div class="menu-items">
        <button id="m-new">New deck…</button>
        <button id="m-rename">Rename…</button>
        <button id="m-duplicate">Duplicate</button>
        <hr>
        <button id="m-delete" class="danger">Delete deck</button>
      </div>
    </details>
    <span class="spacer"></span>
    <div class="actions">
      <div class="btn-row">
        <label class="btn ghost" for="import-input">Import…</label>
        <input id="import-input" type="file" accept="application/json" hidden>
        <button id="export-btn" class="btn">Export deck.json</button>
      </div>
      <span id="save-status" class="save-status"></span>
    </div>
  </header>
  <main>
    <div id="left">
      <div id="deck-pane">
        <div class="pane-head">
          <span class="lbl">Deck</span>
          <span class="count" id="deck-count"></span>
          <span class="spacer"></span>
          <button id="play-btn" class="btn ghost sm" hidden>Play ↗</button>
          <button id="narrate-btn" class="btn sm" hidden>Narrate ↗</button>
        </div>
        <div id="deck-list"></div>
      </div>
      <div id="find-pane">
        <div class="pane-head">
          <input id="find-search" type="text" autocomplete="off" placeholder="Search by name or kind" aria-label="Search">
          <span class="seg" id="find-seg">
            <button data-kind="" class="on">All</button>
            <button data-kind="deck">Shows</button>
            <button data-kind="slide">Slides</button>
          </span>
        </div>
        <div id="results"></div>
      </div>
    </div>
    <aside>
      <div class="prev-head">
        <span class="t" id="preview-title">Nothing selected</span>
        <span class="seg" id="ctx-seg">
          <button data-ctx="wall">Wall</button>
          <button data-ctx="archive" class="on">Archive</button>
        </span>
        <button id="curate-btn" class="btn ghost sm" hidden>Curate ↗</button>
        <button id="preview-open" class="btn ghost sm">Open ↗</button>
      </div>
      <div class="preview-wrap">
        <!-- A nested iframe has no autoplay or media permission unless the parent
             delegates it, and this one hosts the player, which hosts the slide, which
             plays video (or a YouTube embed). Without `allow` the inner media is
             blocked in ways that read as "unreliable" rather than as an error. -->
        <iframe id="preview" title="Preview"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                hidden></iframe>
        <div class="preview-none" id="preview-none">Click anything in the deck, or any search result, to preview it here.</div>
      </div>
      <div class="check-head">
        <span class="lbl">Deck check</span>
        <span class="ok" id="check-ok"></span>
      </div>
      <div id="warnings"></div>
    </aside>
  </main>
  <script src="/assets/js/deck-store.js?v={{ asset_version }}"></script>
  <script src="/assets/js/deck.js?v={{ asset_version }}"></script>
</body>
</html>
